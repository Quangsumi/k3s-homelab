apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.1.3
      helm:
        releaseName: argocd
        valuesObject:
          global:
            priorityClassName: homelab-optional
          controller:
            resources:
              requests:
                cpu: 100m
                memory: 448Mi
              limits:
                memory: 1Gi
          dex:
            resources:
              requests:
                cpu: 5m
                memory: 80Mi
              limits:
                memory: 192Mi
          redis:
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
          repoServer:
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                memory: 512Mi
          applicationSet:
            resources:
              requests:
                cpu: 5m
                memory: 48Mi
              limits:
                memory: 128Mi
          notifications:
            resources:
              requests:
                cpu: 5m
                memory: 48Mi
              limits:
                memory: 128Mi
          server:
            resources:
              requests:
                cpu: 10m
                memory: 80Mi
              limits:
                memory: 192Mi
            env:
              - name: SSL_CERT_FILE
                value: /etc/homelab/trust/ca-bundle.pem
            volumes:
              - name: homelab-trust
                configMap:
                  name: caddy-trust-bundle
            volumeMounts:
              - name: homelab-trust
                mountPath: /etc/homelab/trust
                readOnly: true
          configs:
            params:
              server.insecure: 'true'   # Traefik terminates TLS at the Ingress, so the Argo CD server serves plain HTTP inside the cluster.
            cm:
              admin.enabled: true
              url: https://argocd.lab
              oidc.config: |
                name: Keycloak
                issuer: https://auth.lab/realms/homelab
                clientID: argocd-ui
                cliClientID: argocd-cli
                clientSecret: $argocd-oidc-secret:clientSecret
                allowedAudiences: ["argocd-ui", "argocd-cli"]
                requestedScopes: ["openid", "profile", "email"]
                # Keycloak's Access Token Lifespan also sets the ID token
                # lifetime (5m). On a UI request with less than 2m left, Argo CD
                # can renew the ID token using its cached refresh token.
                # Client Session Idle and Client Session Max inherit
                # SSO Session Idle (12h) and SSO Session Max (7d). If you return
                # after the UI's ID token expires, Argo CD can send you back
                # to Keycloak, which can sign you in if its session is still live.
                refreshTokenThreshold: 2m
                # argocd login --sso stores a separate token on disk. The CLI
                # tries to refresh an expired ID token when it has a refresh token.
                logoutURL: https://auth.lab/realms/homelab/protocol/openid-connect/logout?id_token_hint={{token}}&post_logout_redirect_uri={{logoutRedirectURL}}
            rbac:
              policy.default: ''
              scopes: '[argocd_roles]'
              policy.csv: |
                  p, role:deployer, applications, sync, default/*, allow
                  g, role:deployer, role:readonly
                  g, cr-argocd-view, role:readonly
                  g, cr-argocd-deploy, role:deployer
                  g, cr-argocd-admin, role:admin
          
    - repoURL: https://github.com/Quangsumi/k3s-homelab.git
      targetRevision: main
      path: infrastructure/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true