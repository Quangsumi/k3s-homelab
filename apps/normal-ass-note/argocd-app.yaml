apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: normal-ass-note
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Quangsumi/normal-ass-note.git
    targetRevision: main
    path: k8n

  destination:
    server: https://kubernetes.default.svc
    namespace: normal-ass-note

  syncPolicy:
    syncOptions:
      - CreateNamespace=true