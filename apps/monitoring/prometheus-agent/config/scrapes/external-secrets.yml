# External secrets metrics. Pod addresses are discovered automatically.
scrape_configs:
- job_name: external-secrets
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - external-secrets
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    action: keep
    regex: external-secrets(-cert-controller|-webhook)?
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: metrics
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    target_label: component
  - target_label: cluster
    replacement: k3s-homelab
