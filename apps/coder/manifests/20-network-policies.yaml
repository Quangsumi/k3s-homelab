apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coder-ingress
  namespace: coder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-kube-system
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coder-workspaces
          podSelector:
            matchLabels:
              app.kubernetes.io/name: coder-workspace
      ports:
        - protocol: TCP
          port: 8080
---
# Clients use Coder's authenticated relay. No direct workspace Service/Ingress.
# Egress remains available for Git, package downloads and the Coder agent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-ingress
  namespace: coder-workspaces
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coder
          podSelector:
            matchLabels:
              app.kubernetes.io/name: coder
