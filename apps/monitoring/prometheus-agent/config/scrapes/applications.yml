# Applications metrics. Pod addresses are discovered automatically.
scrape_configs:
- job_name: litellm
  metrics_path: /metrics
  authorization:
    type: Bearer
    # Existing LiteLLM Secret is mounted here by statefulset.yaml.
    # This authenticates the LiteLLM scrape; it is NOT the Tantrum remote-write token.
    credentials_file: /etc/prometheus/secrets/litellm/LITELLM_MASTER_KEY
  static_configs:
  - targets:
    - litellm.litellm.svc.cluster.local:4000
- job_name: postgres-exporter
  static_configs:
  - targets:
    - postgres-exporter.postgres.svc.cluster.local:9187
