# This file is an instruction for External Secrets; it contains NO token value.
# Exact chain:
# Infisical /prometheus/REMOTE_WRITE_BEARER_TOKEN
#   -> this ExternalSecret: prometheus-agent-remote-write-credentials
#   -> Kubernetes Secret: prometheus-agent-remote-write-token, key: token
#   -> statefulset.yaml mounts that key as /etc/prometheus/secrets/remote-write/token
#   -> config/prometheus.yml reads that file through authorization.credentials_file
# The value must equal Tantrum Caddy's PROMETHEUS_REMOTE_WRITE_BEARER_TOKEN.
# Generated Secret shape (the operator fills in the value, not this Git file):
#   kind: Secret
#   metadata: {name: prometheus-agent-remote-write-token}
#   data: {token: <base64 representation of the raw token>}
# Kubernetes decodes Secret.data when mounting: the file contains the RAW token.
# Store the raw value in Infisical; do not base64-encode it yourself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-agent-remote-write-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    # Name of the Secret that External Secrets will CREATE; not this ExternalSecret's name.
    name: prometheus-agent-remote-write-token
    creationPolicy: Owner
  data:
  # LEFT: resulting Secret key/file name. RIGHT (remoteRef.key): Infisical lookup path.
  - secretKey: token
    remoteRef:
      key: /prometheus/REMOTE_WRITE_BEARER_TOKEN
