apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  namespace: monitoring
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol
        create_directory: true

    receivers:
      file_log/pods:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/monitoring_otel-agent-*/*/*.log
        start_at: end
        include_file_name: false
        include_file_path: true
        storage: file_storage
        retry_on_failure:
          enabled: true
        operators:
          - id: container-parser
            type: container
            max_log_size: 256KiB

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 160
        spike_limit_mib: 48

      k8s_attributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
          labels:
            - tag_name: app.kubernetes.io.name
              key: app.kubernetes.io/name
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid

      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: k3s-homelab
            action: upsert

      batch:
        timeout: 2s
        send_batch_size: 512
        send_batch_max_size: 1024

    exporters:
      otlp_http/loki:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          queue_size: 1024
          storage: file_storage

    service:
      extensions: [health_check, file_storage]
      pipelines:
        logs:
          receivers: [file_log/pods]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [otlp_http/loki]
      telemetry:
        resource:
          service.name: otel-agent
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-agent
        app.kubernetes.io/part-of: observability
    spec:
      serviceAccountName: otel-agent
      automountServiceAccountToken: true
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/collector.yaml
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName  # k get pod <pod-name> -o jsonpath='{.spec.nodeName}'
          ports:
            - name: self-metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /conf/collector.yaml
              subPath: collector.yaml
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: checkpoints
              mountPath: /var/lib/otelcol
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: otel-agent-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: checkpoints
          hostPath:
            path: /var/lib/otelcol
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: otel-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: otel-agent
  ports:
    - name: self-metrics
      port: 8888
      targetPort: self-metrics

