# Addresses from the skill baseline, last checked 2026-10-13. Confirm before use.
# proxmox_name must match the Proxmox display name exactly (including case).
# VM IDs and lowercase Proxmox names confirmed from the supplied UI screenshot, 2026-10-20.
# ansible_host is for SSH (IP or DNS name). network_address is the guest's actual IP.
all:
  children:
    linux_vms:
      children:
        control_planes:
          hosts:
            tombstone:
              vmid: 100
              ansible_host: tombstone.lab
              network_address: 192.168.63.20
              proxmox_name: tombstone
            whyachi:
              vmid: 101
              ansible_host: whyachi.lab
              network_address: 192.168.63.21
              proxmox_name: whyachi
            biteforce:
              vmid: 111
              ansible_host: biteforce.lab
              network_address: 192.168.63.67
              proxmox_name: biteforce
        workers:
          hosts:
            huge:
              vmid: 104
              ansible_host: huge.lab
              network_address: 192.168.63.23
              proxmox_name: huge
            minotaur:
              vmid: 106
              ansible_host: minotaur.lab
              network_address: 192.168.63.25
              proxmox_name: minotaur
        other_vms:
          hosts:
            valkyrie:
              vmid: 109
              ansible_host: valkyrie.lab
              network_address: 192.168.63.22
              proxmox_name: valkyrie
            tantrum:
              vmid: 102
              ansible_host: tantrum.lab
