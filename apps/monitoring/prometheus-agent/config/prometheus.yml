global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Applied to every outgoing series, including generated up/scrape metrics.
  external_labels:
    cluster: k3s-homelab
scrape_config_files:
  # Relative to THIS main file's directory, /etc/prometheus inside the container.
  # Example match: /etc/prometheus/scrapes/kubernetes.yml (not a Git folder lookup).
  - scrapes/*.yml
remote_write:
  - name: tantrum
    url: https://metrics-write.tantrum.lab/api/v1/write
    authorization:
      type: Bearer
      # Reads the mounted Secret file shown in statefulset.yaml; not an environment variable.
      credentials_file: /etc/prometheus/secrets/remote-write/token
    tls_config:
      # Mounted public Tantrum CA; verifies the destination server's HTTPS certificate.
      # The Kubernetes API CA is a different file under /var/run/secrets/kubernetes.io/.
      ca_file: /etc/prometheus/secrets/remote-write/ca.crt
    queue_config:
      capacity: 5000
      max_shards: 4
      min_shards: 1
