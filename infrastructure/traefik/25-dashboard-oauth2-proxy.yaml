# ForwardAuth and the /oauth2/ route both target this Service.
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard-oauth2-proxy
  namespace: kube-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: traefik-dashboard
  ports:
    - name: http
      port: 4180
      targetPort: http

---
# The Service selects these OAuth2 Proxy pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-dashboard-oauth2-proxy
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: traefik-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: traefik-dashboard
    spec:
      priorityClassName: homelab-dev
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy/oauth2-proxy.cfg
              subPath: oauth2-proxy.cfg
              readOnly: true
            - name: secrets
              mountPath: /etc/oauth2-proxy/secrets
              readOnly: true
            - name: trust
              mountPath: /etc/homelab/trust
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: traefik-dashboard-oauth2-proxy-config
        - name: secrets
          secret:
            secretName: traefik-dashboard-oauth2-proxy-secret
        - name: trust
          configMap:
            name: caddy-trust-bundle
            items:
              - key: ca-bundle.pem
                path: ca-bundle.pem

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-dashboard-oauth2-proxy
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: traefik-dashboard-oauth2-proxy-secret
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: /traefik/OAUTH2_PROXY_CLIENT_SECRET
    - secretKey: cookie-secret
      remoteRef:
        key: /traefik/OAUTH2_PROXY_COOKIE_SECRET

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-dashboard-oauth2-proxy-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: traefik-dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4180
