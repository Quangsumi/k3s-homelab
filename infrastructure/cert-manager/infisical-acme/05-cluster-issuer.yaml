apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: infisical-acme
spec:
  acme:
    # Copy the exact directory URL and KID from the profile in your installed UI.
    server: https://infisical.lab/api/v1/cert-manager/acme/applications/a6724537-4927-49fb-92a3-4eb2303b472e/profiles/49be757f-3612-4117-8a95-9a8aaa6e2c70/directory
    email: djquangsumi@gmail.com
    # Trust for Infisical's HTTPS endpoint, NOT the CA issuing website certs.
    # Generated from ../caddy-root-ca.crt. Update if Caddy's root rotates.
    caBundle: 
    externalAccountBinding:
      keyID: 0c9d5ca9-11f3-4207-9960-15aeffb580a6
      keySecretRef:
        name: infisical-acme-eab
        key: hmacKey
    # ACME account authentication key, NOT a CA key or website key.
    privateKeySecretRef:
      name: infisical-acme-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
                  traefik.ingress.kubernetes.io/router.priority: "10000"
