apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 3100
      grpc_listen_address: 0.0.0.0
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # Loki default lables, values are set by the sender (Fluent Bit or Gateway).
    distributor:
      otlp_config:
        default_resource_attributes_as_index_labels:
          # Add machine selection for the Host Logs dashboard.
          - host.name                    # host_name: e.g. tombstone
          - host.type                    # host_type: proxmox or linux-vm
          # Apps can supply these. For host logs, the gateway sets the first two.
          - service.name                 # service_name: e.g. k3s.service
          - service.namespace            # service_namespace: e.g. homelab-hosts
          - service.instance.id          # service_instance_id, if supplied by an app
          # Pod details from Fluent Bit and the gateway's Kubernetes lookup.
          - k8s.cluster.name             # k8s_cluster_name
          - k8s.namespace.name           # k8s_namespace_name
          - k8s.container.name           # k8s_container_name
          - k8s.pod.name                 # k8s_pod_name
          - k8s.deployment.name          # k8s_deployment_name
          - k8s.statefulset.name         # k8s_statefulset_name
          - k8s.daemonset.name           # k8s_daemonset_name
          - k8s.replicaset.name          # k8s_replicaset_name, if supplied
          - k8s.job.name                 # k8s_job_name, if supplied
          - k8s.cronjob.name             # k8s_cronjob_name, if supplied
          # Keep the other Loki defaults. They appear only if a sender provides them.
          - container.name              # container_name (different from k8s.container.name)
          - cloud.availability_zone     # cloud_availability_zone
          - cloud.region                # cloud_region
          - deployment.environment      # deployment_environment (older app convention)
          - deployment.environment.name # deployment_environment_name

    limits_config:
      allow_structured_metadata: true
      retention_period: 168h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
      max_query_parallelism: 8

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      compaction_interval: 10m

    analytics:
      reporting_enabled: false

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-observability
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      annotations:
        homelab/config-revision: "20261029-host-labels-1"
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: observability
    spec:
      priorityClassName: homelab-diagnostics
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.6.4
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml
              readOnly: true
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
    - name: grpc
      port: 9096
      targetPort: grpc

