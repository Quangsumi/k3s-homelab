apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-gateway-external-auth
  namespace: monitoring
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore

  target:
    name: otel-gateway-external-auth
    creationPolicy: Owner

  data:
    - secretKey: token
      remoteRef:
        key: /otel-gateway/EXTERNAL_BEARER_TOKEN

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: monitoring
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

      bearertokenauth/external:
        filename: /etc/otel-auth/token

    receivers:
      otlp:                         # internal receiver for app in cluster
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      otlp/external:                # external receiver for apps outside cluster
        protocols:
          http:
            endpoint: 0.0.0.0:14318
            auth:
              authenticator: bearertokenauth/external

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96

      k8s_attributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
          labels:
            - tag_name: app.kubernetes.io.name
              key: app.kubernetes.io/name
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: k3s-homelab
            action: upsert

      batch:
        timeout: 2s
        send_batch_size: 512
        send_batch_max_size: 1024

    exporters:
      otlp_grpc/jaeger:
        endpoint: jaeger.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 512

      otlp_http/loki:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 512

      prometheus/applications:
        endpoint: 0.0.0.0:9464
        enable_open_metrics: true
        resource_to_telemetry_conversion:
          enabled: true

    service:
      extensions: [health_check, bearertokenauth/external]
      pipelines:
        traces:
          receivers: [otlp, otlp/external]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [otlp_grpc/jaeger]
        metrics:
          receivers: [otlp, otlp/external]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [prometheus/applications]
        logs:
          receivers: [otlp, otlp/external]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [otlp_http/loki]
      telemetry:
        resource:
          service.name: otel-gateway
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
        app.kubernetes.io/part-of: observability
    spec:
      serviceAccountName: otel-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: otlp-http-external
              containerPort: 14318
            - name: app-metrics
              containerPort: 9464
            - name: self-metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /conf/collector.yaml
              subPath: collector.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: external-auth
              mountPath: /etc/otel-auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-gateway-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: external-auth
          secret:
            secretName: otel-gateway-external-auth
            defaultMode: 0444
            items:
              - key: token
                path: token

---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-http-external
      port: 14318
      targetPort: otlp-http-external
      protocol: TCP
    - name: app-metrics
      port: 9464
      targetPort: app-metrics
    - name: self-metrics
      port: 8888
      targetPort: self-metrics

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-gateway-otlp-http
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - otel-otlp.lab
      secretName: otel-otlp-lab-tls

  rules:
    - host: otel-otlp.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-gateway
                port:
                  name: otlp-http-external