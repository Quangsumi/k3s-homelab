scrape_configs:
- job_name: prometheus-agent
  static_configs:
  - targets: ['localhost:9095']
- job_name: fluent-bit
  metrics_path: /api/v2/metrics/prometheus
  kubernetes_sd_configs:
  - role: endpointslice
    namespaces:
      names:
      - monitoring
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_service_name
    action: keep
    regex: fluent-bit
  - source_labels:
    - __meta_kubernetes_endpointslice_port_name
    action: keep
    regex: http-metrics
