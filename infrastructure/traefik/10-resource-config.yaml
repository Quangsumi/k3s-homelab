apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    service:
      spec:
        type: ClusterIP # override default (LB), LB is now using Tailscale. TailScale LB -> Traefik -> app pods
    
    deployment:
      replicas: 3       # HA with traefik-ingress-proxies
      
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
    
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-kube-system
            topologyKey: kubernetes.io/hostname
    
    ports:
      web:
        http:
          redirections:       # redirect http to https
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
              # ACME solver routers use priority 10000; normal HTTP still redirects.
              priority: 1000
      
      postgres:
        port: 5432
        expose:
          default: true
        exposedPort: 5432
        protocol: TCP
      
      ssh-deepsix:
        port: 2222          # Traefik pod 2222
        expose:
          default: true
        exposedPort: 22     # ssh -> tailscale 22 -> Traefik service 22 -> Traefik pod 2222 -> deepsix 22
        protocol: TCP

      ssh-endgame:
        port: 2223          # Traefik pod 2223
        expose:
          default: true
        exposedPort: 2222   # ssh -> tailscale 2222 -> Traefik service 2222 -> Traefik pod 2223 -> endgame 22
        protocol: TCP
    
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true

    # Secret otel-gateway-app-auth, key token, becomes this container variable.
    # The value is the gateway's existing app token, fetched from Infisical.
    env:
      - name: OTEL_GATEWAY_APP_TOKEN
        valueFrom:
          secretKeyRef:
            name: otel-gateway-app-auth
            key: token

    # ConfigMap key tantrum-caddy.crt becomes this file inside each Traefik pod:
    # /etc/traefik/tantrum-caddy-trust/tantrum-caddy.crt
    volumes:
      - name: tantrum-caddy-trust-bundle
        type: configMap
        mountPath: /etc/traefik/tantrum-caddy-trust

    tracing:
      serviceName: traefik
      # Trace about 1 in 10 new requests. Incoming parent traces keep their decision.
      sampleRate: 0.1
      addInternals: false
      resourceAttributes:
        k8s.cluster.name: k3s-homelab
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: https://otel.tantrum.lab/v1/traces
          headers:
            # Helm puts this text in a container argument. Kubernetes replaces
            # $(OTEL_GATEWAY_APP_TOKEN) with the Secret-backed variable at startup.
            # Example header sent: Authorization: Bearer <actual app token>
            Authorization: "Bearer $(OTEL_GATEWAY_APP_TOKEN)"
          tls:
            ca: /etc/traefik/tantrum-caddy-trust/tantrum-caddy.crt
        grpc:
          enabled: false
    
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true
          pathOverride: kube-system/traefik-tailscale-ha  # fix ArgoCD stuck at Processing
    
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 384Mi
