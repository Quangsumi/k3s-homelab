apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.coder.com/v2
      chart: coder
      targetRevision: 2.38.6
      helm:
        releaseName: coder
        valueFiles:
          - $values/apps/coder/values.yaml
    - repoURL: https://github.com/Quangsumi/k3s-homelab.git
      targetRevision: main
      ref: values
      path: apps/coder/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  # Manual sync only. Review README.md prerequisites before the first sync.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
