http_address = "0.0.0.0:4180"

provider = "keycloak-oidc"
provider_display_name = "Keycloak"
oidc_issuer_url = "https://auth.lab/realms/homelab"

client_id = "kanboard"
client_secret_file = "/etc/oauth2-proxy/secrets/client-secret"
# Keycloak returns the browser to this callback. The proxy sets a session
# cookie and sends the browser back to the originally requested kanboard.lab path.
redirect_url = "https://kanboard.lab/oauth2/callback"
code_challenge_method = "S256"
scope = "openid profile email"

# Access requires this client role in the Keycloak access token.
email_domains = ["*"]
allowed_roles = ["kanboard:cr-kanboard-oauth2-proxy-access"]

# Send authenticated requests to Kanboard's private Service over HTTP.
# The browser stays on kanboard.lab and continues to reach the proxy first.
upstreams = ["http://kanboard.kanboard.svc.cluster.local:80/"]
# Trust request details that Traefik forwards. The proxy's NetworkPolicy
# restricts inbound pod traffic to Traefik.
reverse_proxy = true
trusted_proxy_ips = ["10.42.0.0/16"]
whitelist_domains = ["kanboard.lab"]
skip_provider_button = true

cookie_name = "__Host-kanboard_oauth2"
cookie_secret_file = "/etc/oauth2-proxy/secrets/cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
# The proxy tries Keycloak's refresh token when a request has a cookie over 4m old.
# Use refresh tokens = On. Access Token Lifespan = 5m.
cookie_refresh = "4m"
# A successful refresh restarts the cookie's 12h lifetime. If Keycloak rejects
# the refresh token, the proxy starts sign-in. Temporary errors keep valid sessions.
cookie_expire = "12h"
# Client Session Idle and Client Session Max (both 0) inherit
# SSO Session Idle (sliding 12h) and SSO Session Max (hard 7d cap from sign-in).
# Revoke Refresh Token = Disabled, so using a refresh token doesn't revoke it.
# The sign-in state cookie lasts 15m by default (cookie_csrf_expire).
# Kanboard’s own PHP cookie defaults to a browser-session cookie
# (SESSION_DURATION = 0). The proxy still checks every request.

provider_ca_files = ["/etc/homelab/trust/ca-bundle.pem"]

pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
# Send Keycloak's preferred_username and email in
# X-Forwarded-Preferred-Username and X-Forwarded-Email for Kanboard.
pass_user_headers = true
# Strip incoming copies of proxy-managed auth headers before injecting identity.
skip_auth_strip_headers = true

silence_ping_logging = true
