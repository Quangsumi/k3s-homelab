apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-acme
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab-gitops
    homelab.quangsumi.io/tier: platform
spec:
  project: homelab-platform
  source:
    repoURL: https://github.com/Quangsumi/k3s-homelab.git
    targetRevision: main
    path: infrastructure/cert-manager/infisical-acme
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
