apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - manifest.yaml
  - network-policy.yaml
  - rbac.yaml
  - gateway-auth.yaml

# Standard Kustomize file loading. kubectl and Argo CD build this directly.
# The hash and immutability keep existing pods on their current config snapshot.
configMapGenerator:
  - name: fluent-bit-gateway
    # Each KEY=value line becomes a separate key, e.g. OTEL_GATEWAY_PORT: "443".
    envs:
      - gateway.env
    options:
      immutable: true
      labels:
        app.kubernetes.io/name: fluent-bit
  - name: fluent-bit-config
    # Each key, e.g. buffered.conf, contains the entire file's contents.
    files:
      - survival.conf=profiles/survival/fluent-bit.conf
      - light.conf=profiles/light/fluent-bit.conf
      - buffered.conf=profiles/buffered/fluent-bit.conf
      - busy.conf=profiles/busy/fluent-bit.conf
    options:
      immutable: true
      labels:
        app.kubernetes.io/name: fluent-bit
