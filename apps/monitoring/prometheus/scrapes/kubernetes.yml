# Kubernetes metrics. Pod addresses are discovered automatically.
scrape_configs:
- job_name: kube-state-metrics
  scrape_interval: 30s
  static_configs:
  - targets:
    - kube-state-metrics.monitoring.svc.cluster.local:8080
  metric_relabel_configs:
  - target_label: cluster
    replacement: k3s-homelab
- job_name: node-exporter
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: endpointslice
    namespaces:
      names:
      - monitoring
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_service_name
    action: keep
    regex: node-exporter
  - source_labels:
    - __meta_kubernetes_endpointslice_port_name
    action: keep
    regex: metrics
  metric_relabel_configs:
  - target_label: cluster
    replacement: k3s-homelab
- job_name: kubernetes-kubelet
  scrape_interval: 30s
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - target_label: __address__
    replacement: kubernetes.default.svc.cluster.local:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    regex: (.+)
    replacement: /api/v1/nodes/${1}/proxy/metrics
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: node
  metric_relabel_configs:
  - source_labels:
    - __name__
    action: keep
    regex: kubelet_.*|volume_manager_.*|storage_operation_.*|process_.*|go_.*|rest_client_.*
  - target_label: cluster
    replacement: k3s-homelab
- job_name: kubernetes-cadvisor
  scrape_interval: 30s
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - target_label: __address__
    replacement: kubernetes.default.svc.cluster.local:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    regex: (.+)
    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: node
  metric_relabel_configs:
  - target_label: cluster
    replacement: k3s-homelab
- job_name: kube-state-metrics-self
  scrape_interval: 30s
  static_configs:
  - targets:
    - kube-state-metrics.monitoring.svc.cluster.local:8081
    labels:
      cluster: k3s-homelab
- job_name: kubernetes-apiserver
  scrape_interval: 30s
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  kubernetes_sd_configs:
  - role: endpointslice
    namespaces:
      names:
      - default
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_service_name
    action: keep
    regex: kubernetes
  - source_labels:
    - __meta_kubernetes_endpointslice_port_name
    action: keep
    regex: https
  - source_labels:
    - __meta_kubernetes_endpointslice_endpoint_conditions_ready
    action: keep
    regex: 'true'
  - source_labels:
    - __meta_kubernetes_endpointslice_endpoint_node_name
    target_label: node
  - target_label: cluster
    replacement: k3s-homelab
