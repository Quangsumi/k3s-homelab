apiVersion: 1
datasources:
  - name: Prometheus
    # uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    # jsonData:
    #   derivedFields:
    #     - name: TraceID
    #       matcherRegex: '(?i)(?:trace[_-]?id|traceid)["=: ]+([0-9a-f]{32})'
    #       datasourceUid: jaeger
