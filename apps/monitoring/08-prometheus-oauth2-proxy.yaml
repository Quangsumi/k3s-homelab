apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: prometheus-oauth2-proxy-secret
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: /prometheus/OAUTH2_PROXY_CLIENT_SECRET
    - secretKey: cookie-secret
      remoteRef:
        key: /prometheus/OAUTH2_PROXY_COOKIE_SECRET

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-oauth2-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy/oauth2-proxy.cfg
              subPath: oauth2-proxy.cfg
              readOnly: true
            - name: secrets
              mountPath: /etc/oauth2-proxy/secrets
              readOnly: true
            - name: trust
              mountPath: /etc/homelab/trust
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-oauth2-proxy-config
        - name: secrets
          secret:
            secretName: prometheus-oauth2-proxy-secret
        - name: trust
          configMap:
            name: caddy-trust-bundle
            items:
              - key: ca-bundle.pem
                path: ca-bundle.pem

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-oauth2-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: prometheus
  ports:
    - name: http
      port: 4180
      targetPort: http