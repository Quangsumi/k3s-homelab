apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db
  namespace: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: coder-db
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: /coder/CODER_PG_CONNECTION_URL
