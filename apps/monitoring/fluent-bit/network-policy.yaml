apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-fluent-bit
  namespace: monitoring

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            # Keep the old scraper working during the Agent migration.
            matchExpressions:
              - key: app
                operator: In
                values: [prometheus, prometheus-agent]

      ports:
        - protocol: TCP
          port: 2020
