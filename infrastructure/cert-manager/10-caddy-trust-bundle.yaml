apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: caddy-trust-bundle
spec:
  sources:
    - configMap:
        name: caddy-root-ca
        key: ca.crt
  target:
    configMap:
      key: ca-bundle.pem
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - external-secrets
            - monitoring