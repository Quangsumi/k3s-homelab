http_address = "0.0.0.0:4180"

provider = "keycloak-oidc"
provider_display_name = "Keycloak"
oidc_issuer_url = "https://auth.lab/realms/homelab"

client_id = "traefik-dashboard"
client_secret_file = "/etc/oauth2-proxy/secrets/client-secret"
# Keycloak returns the browser to the route that goes straight to this proxy.
redirect_url = "https://traefik.lab/oauth2/callback"
code_challenge_method = "S256"
scope = "openid profile email"

# Access requires this client role in the Keycloak access token.
email_domains = ["*"]
allowed_roles = ["traefik-dashboard:cr-traefik-dashboard-oauth2-proxy-access"]

# Return an allow response to ForwardAuth. Traefik serves api@internal.
upstreams = ["static://202"]
reverse_proxy = true
trusted_proxy_ips = ["10.42.0.0/16"]
whitelist_domains = ["traefik.lab"]
skip_provider_button = true

cookie_name = "__Host-traefik_dashboard_oauth2"
cookie_secret_file = "/etc/oauth2-proxy/secrets/cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
# The first request after the cookie is 4m old tries a Keycloak refresh.
# Access Token Lifespan is 5m. A request can still renew after the access
# token expires if the refresh token and the browser cookie are still valid.
cookie_refresh = "4m"
# Each cookie lasts 8h from issue. A successful refresh sends a new cookie
# to the browser and starts a fresh 8h. If the cookie expires first, the next
# visit goes to Keycloak and can sign in silently if its session is still live.
cookie_expire = "8h"
# Keycloak sends a refresh token (Use refresh tokens is On). Using it
# does not make it single-use (Revoke Refresh Token is Disabled).
# Client Session Idle and Client Session Max are both 0, so they inherit
# SSO Session Idle (12h) and SSO Session Max (7d). A successful refresh resets
# the 12h idle clocks. The 7d cap on the shared Keycloak login keeps counting.
# If Keycloak rejects an expired refresh token, the proxy starts sign-in again.
# Default cookie_csrf_expire is 15m for finishing the proxy's sign-in callback.

provider_ca_files = ["/etc/homelab/trust/ca-bundle.pem"]

pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false

silence_ping_logging = true
