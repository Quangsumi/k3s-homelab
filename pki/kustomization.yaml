apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Publish certificate sources once. trust-manager handles namespace distribution.
resources:
  - distributions/lab-caddy.yaml
  - distributions/tantrum-caddy.yaml

configMapGenerator:
  - name: caddy-root-ca
    namespace: cert-manager
    files:
      - ca.crt=public/caddy-root.crt
  - name: tantrum-caddy-root-source
    namespace: cert-manager
    files:
      - ca.crt=public/tantrum-caddy.crt

generatorOptions:
  # Distribution rules read these fixed source names.
  disableNameSuffixHash: true
