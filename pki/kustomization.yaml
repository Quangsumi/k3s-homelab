apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

# let kustomize create the ConfigMap from the .crt file,
# instead of manually creating the ConfigMap and put the .crt conent in the ConfigMap
configMapGenerator:
  - name: caddy-root-ca
    files:
      - ca.crt=public/caddy-root.crt

generatorOptions:
  disableNameSuffixHash: true  # eg: caddy-root-ca-6dm7b6tk5g, new change new hash. Disable in this case and let trust-manager handle this.
