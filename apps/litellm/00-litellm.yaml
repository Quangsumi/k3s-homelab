apiVersion: v1
kind: Namespace
metadata:
  name: litellm

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-credentials
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: litellm-secret-infisical
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: /litellm/LITELLM_MASTER_KEY
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: /litellm/LITELLM_SALT_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: /litellm/DATABASE_URL
    - secretKey: UI_USERNAME
      remoteRef:
        key: /litellm/UI_USERNAME
    - secretKey: UI_PASSWORD
      remoteRef:
        key: /litellm/UI_PASSWORD
    - secretKey: GENERIC_CLIENT_SECRET
      remoteRef:
        key: /litellm/GENERIC_CLIENT_SECRET

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    general_settings:
      database_connection_pool_limit: 5
      proxy_batch_write_at: 60
      allow_requests_on_db_unavailable: false
      ui_access_mode: "admin_only"

    litellm_settings:
      callbacks: ["prometheus"]
      service_callback: ["prometheus_system"]
      request_timeout: 600
      set_verbose: false
      json_logs: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm-database:1.86.0
          imagePullPolicy: IfNotPresent
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "4000"
            - "--config"
            - "/app/config.yaml"
            - "--num_workers"
            - "1"
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secret-infisical
                  key: DATABASE_URL
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret-infisical
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret-infisical
                  key: LITELLM_SALT_KEY
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-secret-infisical
                  key: GENERIC_CLIENT_SECRET
            - name: LITELLM_MODE
              value: "PRODUCTION"
            - name: USE_PRISMA_MIGRATE
              value: "True"
            - name: LITELLM_LOG
              value: "INFO"
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: GENERIC_CLIENT_ID
              value: "litellm"
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: "https://auth.lab/realms/homelab/protocol/openid-connect/auth"
            - name: GENERIC_TOKEN_ENDPOINT
              value: "https://auth.lab/realms/homelab/protocol/openid-connect/token"
            - name: GENERIC_USERINFO_ENDPOINT
              value: "https://auth.lab/realms/homelab/protocol/openid-connect/userinfo"
            - name: GENERIC_SCOPE
              value: "openid profile email"
            - name: GENERIC_CLIENT_USE_PKCE
              value: "true"
            - name: GENERIC_USER_ID_ATTRIBUTE
              value: "sub"
            - name: GENERIC_USER_EMAIL_ATTRIBUTE
              value: "email"
            - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
              value: "name"
            - name: GENERIC_USER_FIRST_NAME_ATTRIBUTE
              value: "given_name"
            - name: GENERIC_USER_LAST_NAME_ATTRIBUTE
              value: "family_name"
            - name: GENERIC_USER_ROLE_ATTRIBUTE
              value: "resource_access.litellm.roles"
            - name: PROXY_BASE_URL
              value: "https://litellm.lab"
            - name: SSL_CERT_FILE
              value: "/etc/homelab/trust/ca-bundle.pem"
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/homelab/trust/ca-bundle.pem"
            - name: PROXY_LOGOUT_URL
              value: https://auth.lab/realms/homelab/protocol/openid-connect/logout?client_id=litellm&post_logout_redirect_uri=https%3A%2F%2Flitellm.lab%2Fui

          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 12
          
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180 # prisma migration might take too long
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 120
          
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi

          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: trust
              mountPath: /etc/homelab/trust
              readOnly: true
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
        - name: trust
          configMap:
            name: caddy-trust-bundle
            items:
              - key: ca-bundle.pem
                path: ca-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http

