# External Secrets creates/updates this Kubernetes Secret using Infisical.
# Secret name: prometheus-agent-remote-write-token
# Key: token
# Value: raw value from Infisical /prometheus/REMOTE_WRITE_BEARER_TOKEN.
# Mounted at: /etc/prometheus/secrets/remote-write/token
# Used by: prometheus.yml to authenticate writes to Tantrum.
# Set the Infisical value to Tantrum Caddy's existing PROMETHEUS_REMOTE_WRITE_BEARER_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-agent-remote-write-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    # Name of the Secret that External Secrets will CREATE; not this ExternalSecret's name.
    name: prometheus-agent-remote-write-token
    creationPolicy: Owner
  data:
  # LEFT: resulting Secret key/file name. RIGHT (remoteRef.key): Infisical lookup path.
  - secretKey: token
    remoteRef:
      key: /prometheus/REMOTE_WRITE_BEARER_TOKEN
