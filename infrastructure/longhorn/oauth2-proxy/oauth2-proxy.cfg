http_address = "0.0.0.0:4180"

provider = "keycloak-oidc"
provider_display_name = "Keycloak"
oidc_issuer_url = "https://auth.lab/realms/homelab"

client_id = "longhorn"
client_secret_file = "/etc/oauth2-proxy/secrets/client-secret"
redirect_url = "https://longhorn.lab/oauth2/callback"
code_challenge_method = "S256"
scope = "openid profile email"

email_domains = ["*"]
allowed_roles = ["longhorn:longhorn-access"]

upstreams = ["static://202"]
reverse_proxy = true
trusted_proxy_ips = ["10.42.0.0/16"]
whitelist_domains = ["longhorn.lab"]
proxy_prefix = "/oauth2"
skip_provider_button = true

session_store_type = "cookie"
cookie_name = "__Host-longhorn_oauth2"
cookie_secret_file = "/etc/oauth2-proxy/secrets/cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_refresh = "4m"           # Keycloak's access token lifespan is 5 minutes, cookie refresh should be less than that to avoid 401s
cookie_expire = "8h"

provider_ca_files = ["/etc/homelab/trust/ca-bundle.pem"]

pass_access_token = false
pass_authorization_header = false
set_authorization_header = false
set_xauthrequest = false
pass_user_headers = false
pass_basic_auth = false

silence_ping_logging = true
show_debug_on_error = false