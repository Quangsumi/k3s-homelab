apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-credentials
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab-gitops
    homelab.quangsumi.io/tier: platform
spec:
  project: homelab-platform

  # ESO materializes Secret/operator-oauth from Infisical. Sync this only after
  # external-secrets is healthy and ClusterSecretStore/infisical is Ready.
  source:
    repoURL: https://github.com/Quangsumi/k3s-homelab.git
    targetRevision: main
    path: infrastructure/tailscale/credentials

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
