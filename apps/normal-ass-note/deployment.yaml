apiVersion: v1
kind: Namespace
metadata:
  name: normal-ass-note

---
apiVersion: v1
kind: Secret
metadata:
  name: normal-ass-note-secret
  namespace: normal-ass-note
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres.postgres.svc.cluster.local;Port=5432;Database=normal-ass-note;Username=quangsumi;Password=dbpassword9090"
  Jwt__SigningKey: "development-only-signing-key-change-this-before-production"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: normal-ass-note-config
  namespace: normal-ass-note
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Jwt__Issuer: "normal-ass-note"
  Jwt__Audience: "normal-ass-note-client"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: normal-ass-note
  namespace: normal-ass-note
  labels:
    app.kubernetes.io/name: normal-ass-note
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: normal-ass-note
  template:
    metadata:
      labels:
        app.kubernetes.io/name: normal-ass-note
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: normal-ass-note
          image: quangsumi/normal-ass-note:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: normal-ass-note-config
            - secretRef:
                name: normal-ass-note-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: normal-ass-note
  namespace: normal-ass-note
  labels:
    app.kubernetes.io/name: normal-ass-note
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: normal-ass-note
  ports:
    - name: http
      port: 80
      targetPort: http

