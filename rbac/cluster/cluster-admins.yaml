# control plane config 2 way of mapping
# from jwt token scopes to k8s RBAC subjects
#
# /etc/rancher/k3s/authentication.yaml
# claimMappings:
#       username:
#         claim: preferred_username
#         prefix: "oidc:"
#       groups:
#         claim: groups
#         prefix: "oidc:"

# map from group claim to Group subject
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-cluster-admins
subjects:
  - kind: Group
    name: oidc:grp-kubernetes-api-admin
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: oidc:grp-homelab-admin
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

