coder:
  replicaCount: 1
  # In 2.38.6 the equivalent CODER_EXTERNAL_AUTH_* env name collides with
  # the numbered-provider parser. Keep this setting as a CLI flag.
  commandArgs:
    - server
    - --external-auth-github-default-provider-enable=false
  priorityClassName: homelab-dev
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
  serviceAccount:
    name: coder
    # Provision only in coder-workspaces through the explicit RoleBinding.
    workspacePerms: false
    enableDeployments: false
  securityContext:
    capabilities:
      drop: [ALL]
  env:
    - name: CODER_ACCESS_URL
      value: https://coder.lab
    # Shared workspace apps need a separate browser origin from the Coder UI.
    - name: CODER_WILDCARD_ACCESS_URL
      value: "*.coder.lab"
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db
          key: url
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: "false"
    - name: CODER_TELEMETRY_ENABLE
      value: "false"
    - name: CODER_PROVISIONER_DAEMONS
      value: "1"
    - name: CODER_SECURE_AUTH_COOKIE
      value: "true"
    # Coder starts a 24h session by default (CODER_SESSION_DURATION). Requests
    # extend it unless CODER_DISABLE_SESSION_EXPIRY_REFRESH is enabled. An
    # expired Keycloak access token triggers a refresh on use (Access Token
    # Lifespan is 5m). Client Session Idle and Client Session Max inherit
    # SSO Session Idle (12h without a refresh for Coder) and SSO Session Max
    # (7d from Keycloak login even with activity). If Keycloak rejects refresh,
    # Coder asks for a new sign-in even within its own 24h.
    - name: CODER_OIDC_ISSUER_URL
      value: https://auth.lab/realms/homelab
    - name: CODER_OIDC_CLIENT_ID
      value: coder
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: Sign in with Keycloak
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-oidc
          key: client-secret
    # An administrator provisions accounts and assigns Coder permissions.
    - name: CODER_OIDC_ALLOW_SIGNUPS
      value: "false"
    - name: SSL_CERT_FILE
      value: /etc/homelab/trust/ca-bundle.pem
  volumes:
    - name: homelab-trust
      configMap:
        name: coder-trust-bundle
  volumeMounts:
    - name: homelab-trust
      mountPath: /etc/homelab/trust
      readOnly: true
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist
  ingress:
    enable: true
    className: traefik
    host: coder.lab
    annotations:
      cert-manager.io/cluster-issuer: infisical-acme
      cert-manager.io/private-key-algorithm: RSA
      cert-manager.io/private-key-size: "2048"
      cert-manager.io/private-key-rotation-policy: Always
    tls:
      enable: true
      secretName: coder-lab-tls
