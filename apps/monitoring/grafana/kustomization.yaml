apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
- manifest.yaml
- network-policy.yaml
configMapGenerator:
- name: grafana-log-dashboard-provider
  files:
  - config/log-dashboards.yaml
- name: grafana-log-dashboards
  files:
  - config/dashboards/host-logs.json
  - config/dashboards/pod-logs.json
  - config/dashboards/log-delivery.json
- name: grafana-config
  files:
  - config/grafana.ini
- name: grafana-datasources
  files:
  - prometheus.yaml=config/prometheus-datasource.yaml
