apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-credentials
  namespace: agentgateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: agentgateway-secret-infisical
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /agentgateway/DATABASE_URL
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: /agentgateway/OPENROUTER_API_KEY
    - secretKey: AGENTGATEWAY_CLIENT_KEY
      remoteRef:
        key: /agentgateway/AGENTGATEWAY_CLIENT_KEY
    - secretKey: UI_HTPASSWD
      remoteRef:
        key: /agentgateway/UI_HTPASSWD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: agentgateway
data:
  config.yaml: |
    config:
      adminAddr: "127.0.0.1:15000"
      database:
        url: "$DATABASE_URL"
      storage:
        mode: hybrid

    frontendPolicies:
      http:
        maxBufferSize: 8388608

      accessLog:
        database:
          llm: full
          add:
            debug.request_body: >-
              request.path.startsWith("/v1/")
              ? default(string(request.body), "[body unavailable]")
              : null

            debug.response_body: >-
              request.path.startsWith("/v1/")
              ? default(string(response.body), "[body unavailable]")
              : null

            debug.response_body_prefix: >-
              request.path.startsWith("/v1/")
              ? default(string(response.bodyPrefix), "[prefix unavailable]")
              : null

            debug.tool_calls: 'default(llm.toolCalls, [])'
            debug.parameters: 'default(llm.params, {})'
            debug.requested_model: 'default(llm.requestModel, "")'
            debug.actual_model: 'default(llm.responseModel, "")'
            debug.streaming: 'default(llm.streaming, false)'

            debug.origin: 'default(request.headers["origin"], "")'
            debug.key_name: 'default(apiKey.name, "")'
            debug.backend: 'default(backend.name, "")'
            debug.upstream_duration: 'default(proxy.upstreamDuration, "")'
            debug.time_to_first_token: 'default(llm.timeToFirstToken, "")'

    gateways:
      default:
        port: 4000

    ui:
      gateways: [default]
      policies:
        basicAuth:
          mode: strict
          htpasswd:
            file: /etc/agentgateway/ui-auth/htpasswd

    llm:
      gateways: [default]
      policies:
        # v1.7.0 loses the response body snapshot when it re-encodes compressed LLM replies.
        transformations:
          request:
            set:
              accept-encoding: '"identity"'
        apiKey:
          mode: strict
          keys:
            - key: "$AGENTGATEWAY_CLIENT_KEY"
              metadata:
                name: homelab-pilot
                user: homelab
              allowedModels: [chat-fast]
      models:
        - name: nvidia/nemotron-3-ultra-550b-a55b:free
          visibility: internal
          provider: openrouter
          params:
            apiKey: "$OPENROUTER_API_KEY"
            model: nvidia/nemotron-3-ultra-550b-a55b:free
        - name: nvidia/nemotron-3.5-super-vl:free
          visibility: internal
          provider: openrouter
          params:
            apiKey: "$OPENROUTER_API_KEY"
            model: nvidia/nemotron-3.5-super-vl:free
      virtualModels:
        - name: chat-fast
          routing:
            failover:
              targets:
                - model: nvidia/nemotron-3-ultra-550b-a55b:free
                  priority: 0
                - model: nvidia/nemotron-3.5-super-vl:free
                  priority: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      annotations:
        homelab/config-revision: "20261119-update-config"
      labels:
        app: agentgateway
    spec:
      priorityClassName: homelab-dev
      automountServiceAccountToken: false
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.7.0
          imagePullPolicy: IfNotPresent
          args: ["-f", "/config/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
            - name: health
              containerPort: 15021
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secret-infisical
                  key: DATABASE_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secret-infisical
                  key: OPENROUTER_API_KEY
            - name: AGENTGATEWAY_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secret-infisical
                  key: AGENTGATEWAY_CLIENT_KEY
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: health
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ui-auth
              mountPath: /etc/agentgateway/ui-auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: agentgateway-config
        - name: ui-auth
          secret:
            secretName: agentgateway-secret-infisical
            items:
              - key: UI_HTPASSWD
                path: htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  type: ClusterIP
  selector:
    app: agentgateway
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: agentgateway
  annotations:
    cert-manager.io/cluster-issuer: infisical-acme
    cert-manager.io/private-key-algorithm: RSA
    cert-manager.io/private-key-size: "2048"
    cert-manager.io/private-key-rotation-policy: Always
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - agentgateway.lab
      secretName: agentgateway-lab-tls
  rules:
    - host: agentgateway.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  name: http