---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pi-dashboard
  namespace: pi-dashboard
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pi-dashboard.lab
      secretName: pi-dashboard-lab-tls
  rules:
    - host: pi-dashboard.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pi-dashboard
                port:
                  number: 8080