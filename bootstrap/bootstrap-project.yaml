apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-bootstrap
  namespace: argocd
spec:
  description: Admin-only project for the homelab application inventory
  sourceRepos:
    - https://github.com/Quangsumi/k3s-homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
