apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanboard-data
  namespace: kanboard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard
  namespace: kanboard
spec:
  replicas: 1
  # SQLite and the RWO volume must have only one application writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kanboard
  template:
    metadata:
      labels:
        app: kanboard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kanboard
          image: kanboard/kanboard:v1.2.54
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_DRIVER
              value: sqlite
            - name: PLUGIN_INSTALLER
              value: "false"
            - name: LOG_DRIVER
              value: stderr
          startupProbe:
            httpGet:
              path: /healthcheck.php
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthcheck.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck.php
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kanboard-data
---
apiVersion: v1
kind: Service
metadata:
  name: kanboard
  namespace: kanboard
spec:
  type: ClusterIP
  selector:
    app: kanboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanboard
  namespace: kanboard
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kanboard.lab
      secretName: kanboard-lab-tls
  rules:
    - host: kanboard.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanboard
                port:
                  number: 80
