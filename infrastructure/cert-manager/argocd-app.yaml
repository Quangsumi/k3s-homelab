apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.0
      helm:
        releaseName: cert-manager
        valuesObject:
          global:
            priorityClassName: homelab-optional
          resources:
            requests:
              cpu: 10m
              memory: 80Mi
            limits:
              memory: 192Mi
          webhook:
            resources:
              requests:
                cpu: 5m
                memory: 48Mi
              limits:
                memory: 128Mi
          cainjector:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 192Mi
          crds:
            enabled: true

    - repoURL: https://charts.jetstack.io
      chart: trust-manager
      targetRevision: v0.24.0
      helm:
        releaseName: trust-manager
        valuesObject:
          priorityClassName: homelab-optional
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          app:
            trust:
              namespace: cert-manager

    - repoURL: https://github.com/Quangsumi/k3s-homelab.git
      targetRevision: main
      path: infrastructure/cert-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true