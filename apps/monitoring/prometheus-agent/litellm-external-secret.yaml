# External Secrets creates/updates this Kubernetes Secret using Infisical.
# Secret name: litellm-prometheus-job-secret-infisical
# Key: LITELLM_MASTER_KEY
# Value: fetched from Infisical /prometheus/LITELLM_MASTER_KEY.
# Mounted at: /etc/prometheus/secrets/litellm/LITELLM_MASTER_KEY
# Used by: applications.yml to authenticate the LiteLLM scrape.
# The active definition belongs here; the old Prometheus manifest keeps a commented example.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-prometheus-job-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: litellm-prometheus-job-secret-infisical
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: /prometheus/LITELLM_MASTER_KEY
