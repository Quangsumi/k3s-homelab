# Observability metrics. Pod addresses are discovered automatically.
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: otel-application-metrics
  static_configs:
  - targets:
    - otel-gateway.monitoring.svc.cluster.local:9464
- job_name: otel-gateway
  static_configs:
  - targets:
    - otel-gateway.monitoring.svc.cluster.local:8888
- job_name: fluent-bit
  metrics_path: /api/v1/metrics/prometheus
  kubernetes_sd_configs:
  - role: endpointslice
    namespaces:
      names:
      - monitoring
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_service_name
    action: keep
    regex: fluent-bit
  - source_labels:
    - __meta_kubernetes_endpointslice_port_name
    action: keep
    regex: http-metrics
- job_name: loki
  static_configs:
  - targets:
    - loki.monitoring.svc.cluster.local:3100
- job_name: jaeger
  static_configs:
  - targets:
    - jaeger.monitoring.svc.cluster.local:8888
- job_name: grafana
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - monitoring
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_label_app
    action: keep
    regex: grafana
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: http
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_label_app
    target_label: component
  - target_label: cluster
    replacement: k3s-homelab
