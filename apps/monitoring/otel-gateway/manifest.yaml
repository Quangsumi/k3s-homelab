apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-gateway-external-auth
  namespace: monitoring
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore

  target:
    name: otel-gateway-external-auth
    creationPolicy: Owner

  data:
    - secretKey: token
      remoteRef:
        key: /otel-gateway/EXTERNAL_BEARER_TOKEN

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: monitoring
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

      bearertokenauth/external:
        filename: /etc/otel-auth/token

      file_storage/logs:
        directory: /var/lib/otelcol/logs
        create_directory: true
        fsync: true
        max_size: 1073741824
        compaction:
          on_rebound: true

    receivers:
      otlp:                         # internal receiver for app in cluster
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      otlp/external:                # external receiver for apps outside cluster
        # Outside apps CAN use this. The HTTPS ingress forwards here over HTTP.
        # A receiver name does not expose a LAN port; the Service/Ingress does that.
        protocols:
          http:
            endpoint: 0.0.0.0:14318
            auth:
              authenticator: bearertokenauth/external

      # Host agents use this encrypted LAN listener without needing Tailscale.
      # Same bearer token and certificate name as the existing HTTPS ingress.
      # TLS ends here because this path bypasses Traefik. Logs pipeline only.
      otlp/host-lan:
        protocols:
          http:
            endpoint: 0.0.0.0:14319
            tls:
              cert_file: /etc/otel-lan-tls/tls.crt
              key_file: /etc/otel-lan-tls/tls.key
              # Pick up cert-manager renewals without waiting for a pod restart.
              reload_interval: 1m
            auth:
              authenticator: bearertokenauth/external

    processors:
      # check every 1s to protects the pod from being OOM-killed
      # a log storm could blow past the 512 MiB pod memory limit
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96

      # Log pipeline use this.
      # Handle host journal logs (systemd, non-K8s) 
      # These copies keep the original fields and leave the message text unchanged.
      # Which new fields become Grafana labels? See ../loki/manifest.yaml.
      transform/host:
        error_mode: ignore
        log_statements:

          # Copy machine name/type so Loki can show Machine and Role choices in Grafana.
          # ../loki/manifest.yaml includes host.name and host.type in its label list.
          - set(resource.attributes["host.name"], log.attributes["host_name"]) where log.attributes["host_name"] != nil
          - set(resource.attributes["host.type"], log.attributes["host_role"]) where log.attributes["host_role"] != nil

          # Use host-journal as the service name when no systemd service is available.
          - set(log.attributes["service.name"], "host-journal") where log.attributes["log_source"] == "host"

          # Put all host logs in the homelab-hosts group shown in Grafana.
          - set(resource.attributes["service.namespace"], "homelab-hosts") where log.attributes["log_source"] == "host"

          # If _SYSTEMD_UNIT exists, use its value (e.g. k3s.service) instead of host-journal.
          # Copy to service.name because Loki uses that exact field for the service label.
          - set(log.attributes["service.name"], log.attributes["_SYSTEMD_UNIT"]) where log.attributes["log_source"] == "host" and log.attributes["_SYSTEMD_UNIT"] != nil

      # Keep each journal entry with its own service name.
      # Setting the shared resource directly would label a whole batch as its last service.
      groupbyattrs/host-service:
        keys: [service.name]


      # # Fluent Bit's kubernetes filter puts pod metadata into a nested map like:
      # {
      #   "log": "actual message",
      #   "kubernetes": {
      #     "pod_id": "...",
      #     "pod_name": "...",
      #     "namespace_name": "...",
      #     "host": "...",
      #     "container_name": "...",
      #     "pod_ip": "..."
      #   }
      # }
      # This processor promotes those nested fields up to the resource level (the OTel Resource), 
      # where downstream tools (Loki, Grafana, Jaeger) expect them
      transform/fluentbit_k8s:
        error_mode: ignore

        # Read details collected by the Fluent Bit pod agent. Keep the originals too.
        log_statements:
          # Copy the pod's unique ID so the Kubernetes lookup below can identify it.
          - set(
              resource.attributes["k8s.pod.uid"],
              log.attributes["kubernetes"]["pod_id"]
            ) where log.attributes["kubernetes"]["pod_id"] != nil

          # Copy to k8s.pod.name so Loki can show the k8s_pod_name label.
          - set(
              resource.attributes["k8s.pod.name"],
              log.attributes["kubernetes"]["pod_name"]
            ) where log.attributes["kubernetes"]["pod_name"] != nil

          # Copy to k8s.namespace.name so Loki can show the k8s_namespace_name label.
          - set(
              resource.attributes["k8s.namespace.name"],
              log.attributes["kubernetes"]["namespace_name"]
            ) where log.attributes["kubernetes"]["namespace_name"] != nil

          # Copy the node name to a standard name. The original is searchable too.
          # k8s.node.name is not in our Loki label list.
          - set(
              resource.attributes["k8s.node.name"],
              log.attributes["kubernetes"]["host"]
            ) where log.attributes["kubernetes"]["host"] != nil

          # Copy to k8s.container.name so Loki can show the k8s_container_name label.
          - set(
              resource.attributes["k8s.container.name"],
              log.attributes["kubernetes"]["container_name"]
            ) where log.attributes["kubernetes"]["container_name"] != nil

          # Copy the pod IP as a second way for the Kubernetes lookup to find the pod.
          - set(
              resource.attributes["k8s.pod.ip"],
              log.attributes["kubernetes"]["pod_ip"]
            ) where log.attributes["kubernetes"]["pod_ip"] != nil

          # # After promoting the fields we need, drop the large raw Kubernetes map.
          # - delete_key(log.attributes, "kubernetes")

          # # These are redundant once the body/timestamp are already correct.
          # - delete_key(log.attributes, "time")
          # - delete_key(log.attributes, "logtag")

      # built-in Kubernetes processor
      # queries the API server to fetch pod metadata and adds it to the resource
      k8s_attributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
          # Copy the pod's app.kubernetes.io/name tag. It stays searchable in Loki.
          # This setting does not add it to Grafana's label list.
          labels:
            - tag_name: app.kubernetes.io.name
              key: app.kubernetes.io/name
              from: pod
        pod_association:        # tells the processor how to find the pod. It uses two lookup keys
          - sources:  
              - from: resource_attribute
                name: k8s.pod.uid         # from transform/fluentbit_k8s processor above
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          # for external logs coming through Traefik, the source IP is the Traefik pod's IP, 
          # not the actual sender. If the processor tried to associate by IP, 
          # it would incorrectly tag external host logs as belonging to the Traefik ingress pod. 
          # The k8s.pod.uid association is the primary reliable path; IP association is secondary 
          # and only used when UID is absent

      # Tag everything with the cluster name
      # Only for K8s-origin telemetry. Host journal logs (which don't have a pod name) are left untouched
      transform/cluster:
        error_mode: ignore
        trace_statements:
          - set(resource.attributes["k8s.cluster.name"], "k3s-homelab") where resource.attributes["k8s.pod.name"] != nil
        metric_statements:
          - set(resource.attributes["k8s.cluster.name"], "k3s-homelab") where resource.attributes["k8s.pod.name"] != nil
        log_statements:
          - set(resource.attributes["k8s.cluster.name"], "k3s-homelab") where resource.attributes["k8s.pod.name"] != nil

      # Batch before sending
      batch:
        timeout: 2s
        send_batch_size: 512
        send_batch_max_size: 1024

    exporters:
      debug:
        verbosity: detailed

      otlp_grpc/jaeger:
        endpoint: jaeger.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 512

      otlp_http/loki:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
        sending_queue:
          enabled: true
          storage: file_storage/logs
          queue_size: 512

      prometheus/applications:
        endpoint: 0.0.0.0:9464
        enable_open_metrics: true
        resource_to_telemetry_conversion:
          enabled: true

    service:
      extensions: [health_check, bearertokenauth/external, file_storage/logs]
      pipelines:
        traces:
          receivers: [otlp, otlp/external]
          processors: [memory_limiter, k8s_attributes, transform/cluster, batch]
          exporters: [otlp_grpc/jaeger]
        metrics:
          receivers: [otlp, otlp/external]
          processors: [memory_limiter, k8s_attributes, transform/cluster, batch]
          exporters: [prometheus/applications]
        logs:
          receivers: [otlp, otlp/external, otlp/host-lan]
          # The logs pipeline intentionally skips the batch processor
          # Logs go straight to the exporter, which uses file_storage/logs as its queue.
          processors: [memory_limiter, transform/fluentbit_k8s, transform/host, groupbyattrs/host-service, k8s_attributes, transform/cluster]
          exporters: [otlp_http/loki]
      telemetry:    # self-metrics for the collector itself
        resource:
          service.name: otel-gateway
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/part-of: observability
spec:
  # This combined gateway also owns Prometheus application metric state.
  # One process must own the RWO queue; scale-out needs separate per-replica storage.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
        app.kubernetes.io/part-of: observability
      annotations:
        homelab/config-revision: "20261029-stop-debug"
    spec:
      # tolerations:
      #   - key: node-role.kubernetes.io/control-plane
      #     operator: Exists
      #     effect: NoSchedule

      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: node-role.kubernetes.io/control-plane
      #               operator: Exists

      #   podAntiAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       - labelSelector:
      #           matchLabels:
      #             app.kubernetes.io/name: otel-gateway
      #         topologyKey: kubernetes.io/hostname

      priorityClassName: homelab-diagnostics
      serviceAccountName: otel-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: otlp-external
              containerPort: 14318
            - name: host-lan-tls
              containerPort: 14319
            - name: app-metrics
              containerPort: 9464
            - name: self-metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          # Let the saved queue open during recovery before liveness can restart us.
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 288Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: log-queue
              mountPath: /var/lib/otelcol
            - name: config
              mountPath: /conf/collector.yaml
              subPath: collector.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: external-auth
              mountPath: /etc/otel-auth
              readOnly: true
            - name: host-lan-tls
              mountPath: /etc/otel-lan-tls
              readOnly: true
      volumes:
        - name: log-queue
          persistentVolumeClaim:
            claimName: otel-gateway-log-queue
        - name: config
          configMap:
            name: otel-gateway-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: external-auth
          secret:
            secretName: otel-gateway-external-auth
            defaultMode: 0444
            items:
              - key: token
                path: token
        - name: host-lan-tls
          secret:
            secretName: otel-otlp-lab-tls
            defaultMode: 0440

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-gateway-log-queue
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-external
      port: 14318
      targetPort: otlp-external
      protocol: TCP
    - name: app-metrics
      port: 9464
      targetPort: app-metrics
    - name: self-metrics
      port: 8888
      targetPort: self-metrics

---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway-host-lan
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: host-lan-tls
      port: 14319
      targetPort: host-lan-tls
      nodePort: 31419

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-gateway-otlp-http
  namespace: monitoring
  annotations:
    # cert-manager.io/cluster-issuer: homelab-ca
    cert-manager.io/cluster-issuer: infisical-acme
    cert-manager.io/private-key-algorithm: RSA
    cert-manager.io/private-key-size: "2048"
    cert-manager.io/private-key-rotation-policy: Always # Rotate the private key on every certificate renewal
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - otel-otlp.lab
      secretName: otel-otlp-lab-tls

  rules:
    - host: otel-otlp.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-gateway
                port:
                  name: otlp-external
