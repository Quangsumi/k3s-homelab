apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-agent-remote-write-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: prometheus-agent-remote-write-token
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: /prometheus/REMOTE_WRITE_BEARER_TOKEN
