# account Ansible uses to log in over SSH
ansible_user: "{{ inventory_hostname }}"

# These 3 work together.
# When a task has become: true
# Use sudo to swtch to root, 
# and use password from vault to switch to root.
ansible_become_method: sudo
ansible_become_user: root
ansible_become_password: "{{ (vault_hosts | default({})).get(inventory_hostname, {}).get('sudo_password', none) }}"

# there could be 2 sudo programs (sudo-rs, /usr/bin/sudo.ws)
# this tell Ansible to use the one it handles correctly during become
ansible_sudo_exe: /usr/bin/sudo.ws