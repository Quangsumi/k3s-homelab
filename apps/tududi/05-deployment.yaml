apiVersion: v1
kind: Namespace
metadata:
  name: tududi

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tududi-credentials
  namespace: tududi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: tududi-secret-infisical
    creationPolicy: Owner
  data:
    - secretKey: TUDUDI_USER_EMAIL
      remoteRef:
        key: /tududi/TUDUDI_USER_EMAIL
    - secretKey: TUDUDI_USER_PASSWORD
      remoteRef:
        key: /tududi/TUDUDI_USER_PASSWORD
    - secretKey: TUDUDI_SESSION_SECRET
      remoteRef:
        key: /tududi/TUDUDI_SESSION_SECRET

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tududi
  namespace: tududi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tududi
  template:
    metadata:
      labels:
        app: tududi
    spec:
      containers:
        - name: tududi
          image: chrisvel/tududi:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - secretRef:
                name: tududi-secret-infisical
          volumeMounts:
            - name: database
              mountPath: /app/db
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: tududi-db

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tududi-db
  namespace: tududi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 3Gi

---
apiVersion: v1
kind: Service
metadata:
  name: tududi
  namespace: tududi
spec:
  type: ClusterIP
  selector:
    app: tududi
  ports:
    - name: http
      port: 3002
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tududi
  namespace: tududi
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tududi.lab
      secretName: tududi-lab-tls
  rules:
    - host: tududi.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tududi
                port:
                  number: 3002