apiVersion: v1
kind: Namespace
metadata:
  name: pi-dashboard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-dashboard
  namespace: pi-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pi-dashboard
  template:
    metadata:
      labels:
        app: pi-dashboard
    spec:
      automountServiceAccountToken: false # pod will not have access to the Kubernetes API

      # 1 pod can have many containers, this security context applies to all containers
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault # restricts the pod to a default set of syscalls, preventing the use of potentially dangerous ones

      containers:
        - name: pi-dashboard
          image: quangsumi/pi-dashboard:88e0a6c16b2c5b2e826fdac2fc611438ba57a2c6@sha256:fb502c689b2ea8324e76716f14f0314eb270a0152986a92f8ec5fb818b106109
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # prevents the container from writing to the root filesystem, reducing the risk of tampering with system files
            capabilities:
              drop:
                - ALL
          
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi

          # readOnlyRootFilesystem: true -> everything in the container is read-only, 
          # so we need to mount a tmp volume for the app nginx to write temp files to
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi

---
apiVersion: v1
kind: Service
metadata:
  name: pi-dashboard
  namespace: pi-dashboard
  labels:
    app: pi-dashboard
spec:
  type: ClusterIP
  selector:
    app: pi-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http

