apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab-gitops
    homelab.quangsumi.io/tier: platform
spec:
  project: homelab-platform

  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.0
      helm:
        releaseName: cert-manager
        valuesObject:
          crds:
            enabled: true

    - repoURL: https://charts.jetstack.io
      chart: trust-manager
      targetRevision: v0.24.0
      helm:
        releaseName: trust-manager
        valuesObject:
          app:
            trust:
              namespace: cert-manager

    - repoURL: https://github.com/Quangsumi/k3s-homelab.git
      targetRevision: main
      path: infrastructure/cert-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    syncOptions:
      - CreateNamespace=true