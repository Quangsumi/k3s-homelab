# Network metrics. Pod addresses are discovered automatically.
scrape_configs:
- job_name: traefik
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - kube-system
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    action: keep
    regex: traefik
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: metrics
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  metric_relabel_configs:
  - target_label: cluster
    replacement: k3s-homelab
- job_name: coredns
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - kube-system
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_label_k8s_app
    action: keep
    regex: kube-dns
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: metrics
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_label_k8s_app
    target_label: component
  - target_label: cluster
    replacement: k3s-homelab
- job_name: kube-vip
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - kube-system
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    action: keep
    regex: kube-vip-ds
  - source_labels:
    - __meta_kubernetes_pod_container_name
    action: keep
    regex: kube-vip
  - source_labels:
    - __meta_kubernetes_pod_ip
    target_label: __address__
    regex: (.+)
    replacement: ${1}:2112
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    target_label: component
  - target_label: cluster
    replacement: k3s-homelab
- job_name: tailscale-operator
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - tailscale
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_label_app
    action: keep
    regex: operator
  - source_labels:
    - __meta_kubernetes_pod_container_name
    action: keep
    regex: operator
  - source_labels:
    - __meta_kubernetes_pod_ip
    target_label: __address__
    regex: (.+)
    replacement: ${1}:8080
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_label_app
    target_label: component
  - target_label: cluster
    replacement: k3s-homelab
