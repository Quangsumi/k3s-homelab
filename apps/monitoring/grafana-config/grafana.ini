[server]
root_url = https://grafana.lab

[security]
admin_user = $__file{/etc/grafana/secrets/admin-user}
admin_password = $__file{/etc/grafana/secrets/admin-password}

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
auto_login = false
client_id = grafana
client_secret = $__file{/etc/grafana/secrets/oidc-client-secret}
scopes = openid profile email
auth_url = https://auth.lab/realms/homelab/protocol/openid-connect/auth
token_url = https://auth.lab/realms/homelab/protocol/openid-connect/token
api_url = https://auth.lab/realms/homelab/protocol/openid-connect/userinfo
login_attribute_path = preferred_username
name_attribute_path = name
email_attribute_path = email
groups_attribute_path = groups
allowed_groups = grafana-viewers,grafana-editors,grafana-admins
role_attribute_path = contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || contains(groups[*], 'grafana-viewers') && 'Viewer'
role_attribute_strict = true
skip_org_role_sync = false
use_pkce = true
tls_client_ca = /etc/homelab/trust/ca-bundle.pem