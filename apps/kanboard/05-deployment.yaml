apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanboard-data
  namespace: kanboard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 3Gi
      
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanboard
  namespace: kanboard
  annotations:
    # Argo CD applies the proxy and NetworkPolicies in the default wave (0).
    # Enable trusted-header login in wave 1, after the policies are in place.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # SQLite and the RWO volume must have only one application writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kanboard
  template:
    metadata:
      labels:
        app: kanboard
    spec:
      priorityClassName: homelab-dev
      automountServiceAccountToken: false
      containers:
        - name: kanboard
          image: kanboard/kanboard:v1.2.54
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_DRIVER
              value: sqlite
            - name: PLUGIN_INSTALLER
              value: "false"
            - name: LOG_DRIVER
              value: stderr
            - name: REVERSE_PROXY_AUTH
              value: "true"
            # PHP exposes the proxy's X-Forwarded-Preferred-Username and
            # X-Forwarded-Email headers under these HTTP_* names.
            - name: REVERSE_PROXY_USER_HEADER
              value: HTTP_X_FORWARDED_PREFERRED_USERNAME
            - name: REVERSE_PROXY_EMAIL_HEADER
              value: HTTP_X_FORWARDED_EMAIL
            # Kanboard requires a trusted source IP before it accepts the
            # identity headers. Use the K3s pod CIDR because proxy IPs can change.
            # The NetworkPolicy allows only Kanboard's proxy pods in that range.
            - name: TRUSTED_PROXY_NETWORKS
              value: 10.42.0.0/16
            - name: HIDE_LOGIN_FORM
              value: "true"
          startupProbe:
            httpGet:
              path: /healthcheck.php
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthcheck.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck.php
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kanboard-data
---
apiVersion: v1
kind: Service
metadata:
  name: kanboard
  namespace: kanboard
spec:
  type: ClusterIP
  selector:
    app: kanboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanboard
  namespace: kanboard
  annotations:
    # Wave 1 also moves the public route to the proxy after the wave 0 setup.
    # The Ingress and Deployment have no separate wait between them.
    argocd.argoproj.io/sync-wave: "1"
    # cert-manager.io/cluster-issuer: homelab-ca
    cert-manager.io/cluster-issuer: infisical-acme
    cert-manager.io/private-key-algorithm: RSA
    cert-manager.io/private-key-size: "2048"
    cert-manager.io/private-key-rotation-policy: Always   # Rotate the private key on every certificate renewal
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kanboard.lab
      secretName: kanboard-lab-tls
  rules:
    - host: kanboard.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Both the app paths and /oauth2/callback reach the proxy.
                name: kanboard-oauth2-proxy
                port:
                  number: 4180
