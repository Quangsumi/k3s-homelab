apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-agent-private-ui
spec:
  podSelector:
    matchLabels:
      app: prometheus-agent
  policyTypes: [Ingress]
  # Block direct connections from other pods, including to the UI on port 9095.
  # Scraping/sending out is unaffected: this policy only controls incoming traffic.
  # Node health probes and authenticated kubectl port-forward still work.
  ingress: []
