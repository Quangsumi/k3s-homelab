apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-stremio
  namespace: stremio
spec:
  podSelector:
    matchLabels:
      app: stremio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-kube-system
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 11470
# Egress remains unrestricted: DNS, trackers, DHT and peers use dynamic
# addresses and TCP/UDP ports. No public inbound BitTorrent port is exposed.
