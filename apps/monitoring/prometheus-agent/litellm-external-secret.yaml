# Active definition shared by the old server and the new Agent during migration.
# Infisical /prometheus/LITELLM_MASTER_KEY
# -> ExternalSecret litellm-prometheus-job-credentials
# -> Secret litellm-prometheus-job-secret-infisical, key LITELLM_MASTER_KEY
# -> /etc/prometheus/secrets/litellm/LITELLM_MASTER_KEY in either collector
# -> applications.yml: authorization.credentials_file
# Keeping the active definition in this app lets the old Prometheus app be retired.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-prometheus-job-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: litellm-prometheus-job-secret-infisical
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: /prometheus/LITELLM_MASTER_KEY
