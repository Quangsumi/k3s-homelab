apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kanboard-ingress
spec:
  podSelector:
    matchLabels:
      app: kanboard
  policyTypes:
    - Ingress
  ingress:
    # Only these pods may supply Kanboard's authenticated-user headers.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: kanboard
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kanboard-oauth2-proxy-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: kanboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4180
