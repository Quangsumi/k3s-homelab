apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring

data:
  fluent-bit.conf: |
    [SERVICE] # Global runtime settings
        Flush                     2
        Grace                     30
        Log_Level                 info

        # Persistent disk buffering.
        # If gateway is down, chunks spill to this path on the node's filesystem
        storage.path              /var/lib/fluent-bit/pods/queue
        storage.sync              full
        storage.checksum          on
        storage.max_chunks_up     16
        storage.backlog.mem_limit 5M

        # Fluent Bit internal monitoring.
        # Exposes an internal HTTP API on port 2020 (used by health/liveness probes)
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020

        Health_Check              On


    # ------------------------------------------------------------
    # INPUT
    #
    # Read container stdout/stderr logs from this Kubernetes node.
    # ------------------------------------------------------------
    [INPUT]
        Name              tail        # plugin type
        Tag               kube.*      # tag prefix for all records from this input

        Path              /var/log/containers/*.log

        # Don't recursively ingest Fluent Bit's own logs.
        Exclude_Path      /var/log/containers/fluent-bit-*_monitoring_*.log

        # uses the CRI (Container Runtime Interface) multi-line parser. 
        # This is important because Kubernetes splits each log file's content 
        # into "partial records" (each line is actually a JSON envelope with 
        # a log field and a stream field). The CRI parser reassembles these partial 
        # records into complete log lines before they reach the filter.
        multiline.parser  cri

        # Remember the offset of every file.
        # so Fluent Bit doesn't re-read the whole file on restart
        DB                /var/lib/fluent-bit/pods/flb_kube.db
        DB.Sync           Full

        Refresh_Interval  10
        Rotate_Wait       30
        Skip_Long_Lines   On
        Buffer_Max_Size   256K

        Mem_Buf_Limit     10M

        # Spill buffered chunks to disk when necessary.
        storage.type      filesystem


    # Runtime CRI partial records are reconstructed at the input. Application
    # stack-trace grouping stays disabled: its 5.1.2 regression fixture failed.
    [FILTER]
        Name                kubernetes        # plugin type
        Match               kube.*            # INPUT produces this tag

        # Query the Kubernetes API for pod metadata (labels, annotations, node name, container name, etc.)
        # CA, Token are injected by the SA fluent-bit (see the DaemonSet spec below)
        # Kubernetes automatically mounts these files into every pod that uses a ServiceAccount
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token

        # strip this prefix off the tag, the rest is the pod identifier
        Kube_Tag_Prefix     kube.var.log.containers.

        Merge_Log           On
        Keep_Log            On

        Labels              On
        Annotations         Off


    [OUTPUT]
        Name          opentelemetry
        Match         kube.*

        Host          otel-gateway.monitoring.svc.cluster.local
        Port          4318

        Logs_URI      /v1/logs

        # THIS is the important part.
        #
        # Use only the actual application log as the OTLP Body.
        Logs_Body_Key             $log

        # Everything else in the Fluent Bit record becomes
        # OTLP LogRecord attributes.
        #
        # That includes the "kubernetes" map added by
        # the Kubernetes filter.
        Logs_Body_Key_Attributes  On

        TLS           Off
        Retry_Limit   no_limits
        storage.total_limit_size 512M

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring

  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit

  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/part-of: observability
      annotations:
        # Update fluent-bit.conf will not trigger rollout
        # Bump when subPath-mounted configuration changes to trigger rollout.
        homelab/config-revision: "20261027-2"

    spec:
      priorityClassName: homelab-diagnostics
      serviceAccountName: fluent-bit
      automountServiceAccountToken: true

      # Same idea as your current otel-agent:
      # run on every node, including tainted control-plane nodes.
      tolerations:
        - operator: Exists

      securityContext:
        runAsUser: 0
        runAsGroup: 0

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: fluent-bit

          image: fluent/fluent-bit:5.1.2
          imagePullPolicy: IfNotPresent

          args:
            - --config=/fluent-bit/etc/fluent-bit.conf  # fluent-bit binary expects its config at this path

          ports:
            - name: http-metrics
              containerPort: 2020
              protocol: TCP

          readinessProbe:
            httpGet:
              # Output failures should affect readiness, not restart the buffer.
              path: /api/v1/health
              port: http-metrics

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/v1/metrics
              port: http-metrics

            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 10m
              memory: 48Mi

            limits:
              memory: 96Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf    # place only this file and leave the rest of the directory intact.
                                          # better approach: use "items" with configMap, no need bump annotation, auto rollout on config change.
              readOnly: true

            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true

            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true

            - name: state
              mountPath: /var/lib/fluent-bit/pods

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: fluent-bit-config

        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: Directory

        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory

        - name: state
          hostPath:
            # Migrate the old stopped collector's cursor and queue first.
            # See ansible/playbooks/fluent-bit/STATE-MIGRATION.md.
            path: /var/lib/fluent-bit/pods
            type: Directory

        - name: tmp
          emptyDir:
            sizeLimit: 32Mi


---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
  namespace: monitoring

  labels:
    app.kubernetes.io/name: fluent-bit

spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: fluent-bit

  ports:
    - name: http-metrics
      port: 2020
      targetPort: http-metrics
