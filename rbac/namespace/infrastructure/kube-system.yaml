apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-service-admin
  namespace: kube-system
rules:
- apiGroups:
  - ""
  resourceNames:
  - traefik-tailscale-ha
  resources:
  - services
  verbs:
  - get
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-infrastructure-admins
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-service-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: oidc:infrastructure-admins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-infrastructure-viewers
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: oidc:infrastructure-viewers
