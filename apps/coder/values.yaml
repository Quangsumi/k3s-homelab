coder:
  replicaCount: 1
  # In 2.38.6 the equivalent CODER_EXTERNAL_AUTH_* env name collides with
  # the numbered-provider parser. Keep this setting as a CLI flag.
  commandArgs:
    - server
    - --external-auth-github-default-provider-enable=false
  priorityClassName: homelab-dev
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
  serviceAccount:
    name: coder
    # Provision only in coder-workspaces through the explicit RoleBinding.
    workspacePerms: false
    enableDeployments: false
  securityContext:
    capabilities:
      drop: [ALL]
  env:
    - name: CODER_ACCESS_URL
      value: https://coder.lab
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db
          key: url
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: "false"
    - name: CODER_TELEMETRY_ENABLE
      value: "false"
    - name: CODER_PROVISIONER_DAEMONS
      value: "1"
    - name: CODER_SECURE_AUTH_COOKIE
      value: "true"
    - name: SSL_CERT_FILE
      value: /etc/homelab/trust/ca-bundle.pem
  volumes:
    - name: homelab-trust
      configMap:
        name: coder-trust-bundle
  volumeMounts:
    - name: homelab-trust
      mountPath: /etc/homelab/trust
      readOnly: true
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist
  ingress:
    enable: true
    className: traefik
    host: coder.lab
    annotations:
      cert-manager.io/cluster-issuer: infisical-acme
      cert-manager.io/private-key-algorithm: RSA
      cert-manager.io/private-key-size: "2048"
      cert-manager.io/private-key-rotation-policy: Always
    tls:
      enable: true
      secretName: coder-lab-tls
