[server]
root_url = https://grafana.lab

[security]
admin_user = $__file{/etc/grafana/secrets/admin-user}
admin_password = $__file{/etc/grafana/secrets/admin-password}

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
auto_login = false
client_id = grafana
client_secret = $__file{/etc/grafana/secrets/oidc-client-secret}
scopes = openid profile email
auth_url = https://auth.lab/realms/homelab/protocol/openid-connect/auth
token_url = https://auth.lab/realms/homelab/protocol/openid-connect/token
api_url = https://auth.lab/realms/homelab/protocol/openid-connect/userinfo
signout_redirect_url = https://auth.lab/realms/homelab/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.lab%2Flogin
login_attribute_path = preferred_username
name_attribute_path = name
email_attribute_path = email
groups_attribute_path = groups
allowed_groups = grafana-viewers,grafana-editors,grafana-admins
role_attribute_path = contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || contains(groups[*], 'grafana-viewers') && 'Viewer'
role_attribute_strict = true
skip_org_role_sync = false
use_pkce = true
; Grafana tries to refresh expired Keycloak tokens on use (Access Token Lifespan = 5m).
; Client Session Idle and Client Session Max inherit SSO Session Idle
; (sliding 12h) and SSO Session Max (hard 7d cap). Sign in again if refresh fails.
; Grafana [auth] defaults are a sliding 7d idle window and a hard 30d login cap.
; Local token rotation resets the idle window every 10m while you use Grafana.
use_refresh_token = true
tls_client_ca = /etc/homelab/trust/ca-bundle.pem

# Optional: Grafana validate the ID token using the JWKS endpoint (public keys to verify jwt issued by Keyloack server)
; validate_id_token = true
; jwk_set_url = https://auth.lab/realms/homelab/protocol/openid-connect/certs