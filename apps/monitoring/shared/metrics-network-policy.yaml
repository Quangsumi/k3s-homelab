apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-cluster-metrics
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - kube-state-metrics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            # Keep the old scraper working during the Agent migration.
            matchExpressions:
              - key: app
                operator: In
                values: [prometheus, prometheus-agent]
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
