apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway
  namespace: monitoring
automountServiceAccountToken: true

# ---
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: otel-agent
#   namespace: monitoring
# automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-otel-k8s-attributes
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-otel-gateway-k8s-attributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-otel-k8s-attributes
subjects:
  - kind: ServiceAccount
    name: otel-gateway
    namespace: monitoring

