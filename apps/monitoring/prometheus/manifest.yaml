apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-prometheus-job-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: litellm-prometheus-job-secret-infisical
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: /prometheus/LITELLM_MASTER_KEY

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitoring
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      priorityClassName: homelab-diagnostics
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      # affinity:
      #   nodeAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #       - weight: 100
      #         preference:
      #           matchExpressions:
      #             - key: homelab.io/stability
      #               operator: In
      #               values:
      #                 - stable
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 65534:65534 /prometheus
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.4
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=5d"
            - "--storage.tsdb.retention.size=4000MB"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 30
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 576Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        # One read-only mount contains main config, job files and the existing token.
        - name: prometheus-config
          projected:
            sources:
              - configMap:
                  name: prometheus-config
              - configMap:
                  name: prometheus-scrapes
                  items:
                    - key: applications.yml
                      path: scrapes/applications.yml
                    - key: kubernetes.yml
                      path: scrapes/kubernetes.yml
                    - key: observability.yml
                      path: scrapes/observability.yml
                    - key: network.yml
                      path: scrapes/network.yml
                    - key: argocd.yml
                      path: scrapes/argocd.yml
                    - key: certificates.yml
                      path: scrapes/certificates.yml
                    - key: external-secrets.yml
                      path: scrapes/external-secrets.yml
                    - key: storage.yml
                      path: scrapes/storage.yml
              - secret:
                  name: litellm-prometheus-job-secret-infisical
                  items:
                    - key: LITELLM_MASTER_KEY
                      path: secrets/litellm/LITELLM_MASTER_KEY
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
