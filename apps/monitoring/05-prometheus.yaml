apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-prometheus-job-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: litellm-prometheus-job-secret-infisical
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: /prometheus/LITELLM_MASTER_KEY

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: litellm
        metrics_path: /metrics
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/litellm/LITELLM_MASTER_KEY
        static_configs:
          - targets:
              - litellm.litellm.svc.cluster.local:4000

      - job_name: postgres-exporter
        static_configs:
          - targets:
              - postgres-exporter.postgres.svc.cluster.local:9187

      - job_name: kube-state-metrics      # k3s api server metrics
        scrape_interval: 30s
        static_configs:
          - targets:
              - kube-state-metrics.monitoring.svc.cluster.local:8080
        metric_relabel_configs:
          - target_label: cluster
            replacement: k3s-homelab

      - job_name: node-exporter           # Linux node metrics
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
        metric_relabel_configs:
          - target_label: cluster
            replacement: k3s-homelab

      - job_name: kubernetes-kubelet        # not deployed by you, it already exist as part of Kubernetes/K3s, for kubelet metrics on each node
        scrape_interval: 30s
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # K3s exposes metrics from several embedded control-plane components
          # through this endpoint. Keep this job scoped to kubelet/node health;
          # scrape control-plane components with dedicated jobs later.
          - source_labels: [__name__]
            action: keep
            regex: kubelet_.*|volume_manager_.*|storage_operation_.*|process_.*|go_.*|rest_client_.*
          - target_label: cluster
            replacement: k3s-homelab

      - job_name: kubernetes-cadvisor   # not deployed by you, it already exist as part of Kubernetes/K3s, for container metrics
        scrape_interval: 30s
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - target_label: cluster
            replacement: k3s-homelab

      - job_name: otel-application-metrics
        static_configs:
          - targets:
              - otel-gateway.monitoring.svc.cluster.local:9464

      - job_name: otel-gateway
        static_configs:
          - targets:
              - otel-gateway.monitoring.svc.cluster.local:8888

      # - job_name: otel-agent
      #   kubernetes_sd_configs:
      #     - role: endpoints
      #       namespaces:
      #         names: [monitoring]
      #   relabel_configs:
      #     - source_labels: [__meta_kubernetes_service_name]
      #       action: keep
      #       regex: otel-agent
      #     - source_labels: [__meta_kubernetes_endpoint_port_name]
      #       action: keep
      #       regex: self-metrics

      - job_name: fluent-bit
        metrics_path: /api/v1/metrics/prometheus
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: fluent-bit
          - source_labels:
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: http-metrics

      - job_name: loki
        static_configs:
          - targets:
              - loki.monitoring.svc.cluster.local:3100

      - job_name: jaeger
        static_configs:
          - targets:
              - jaeger.monitoring.svc.cluster.local:8888

      - job_name: traefik
        scrape_interval: 30s

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system

        relabel_configs:
          # Only Traefik pods
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            action: keep
            regex: traefik

          # Only Traefik's metrics container port
          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            action: keep
            regex: metrics

          # Useful labels in Prometheus/Grafana
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node

          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

        metric_relabel_configs:
          - target_label: cluster
            replacement: k3s-homelab

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitoring
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      # affinity:
      #   nodeAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #       - weight: 100
      #         preference:
      #           matchExpressions:
      #             - key: homelab.io/stability
      #               operator: In
      #               values:
      #                 - stable
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 65534:65534 /prometheus
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.4
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--storage.tsdb.retention.size=2500MB"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
            - name: litellm-prometheus-job-secret-infisical
              mountPath: /etc/prometheus/secrets/litellm
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: litellm-prometheus-job-secret-infisical
          secret:
            secretName: litellm-prometheus-job-secret-infisical
            items:
              - key: LITELLM_MASTER_KEY
                path: LITELLM_MASTER_KEY
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
