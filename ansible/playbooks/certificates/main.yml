# From ansible/: ansible-playbook playbooks/certificates/main.yml --limit rpivn --check --diff
# Distribute public trust files and render K3s OIDC configuration.
- name: Distribute public trust to one selected host
  hosts: pki_consumers
  gather_facts: false
  vars:
    pki_dir: "{{ playbook_dir }}/../../../pki"
    rpivn_caddy_ca_src: "{{ pki_dir }}/public/rpivn-caddy.crt"

  tasks:
    - name: Require one explicitly selected host
      ansible.builtin.assert:
        that:
          - ansible_limit | default('') | length > 0
          - ansible_play_hosts_all | length == 1
        fail_msg: Select one PKI consumer by inventory hostname with --limit.

    # The Pi user owns this existing directory; keep the filenames consumers use.
    - name: Copy certs to rpivn
      ansible.builtin.copy:
        src: "{{ pki_dir }}/{{ item.src }}"
        dest: "/home/pi/Desktop/rpivn-app/ca/{{ item.dest }}"
        owner: pi
        group: pi
        mode: '0644'
        backup: true
      loop:
        - { src: public/rpivn-caddy.crt, dest: rpivn-caddy.crt }
        - { src: bundles/application-trust.pem, dest: homelab-root-ca.pem }
        - { src: public/k3s-server-ca.crt, dest: k3s-ca.pem }
        - { src: bundles/proxmox-api-trust.pem, dest: proxmox-trust.pem }
        - { src: public/tantrum-caddy.crt, dest: tantrum-caddy.pem }
      when: inventory_hostname == 'rpivn'

    - name: Copy certs to valkyrie
      ansible.builtin.copy:
        src: "{{ pki_dir }}/{{ item.src }}"
        dest: "/home/valkyrie/ca/{{ item.dest }}"
        owner: valkyrie
        group: valkyrie
        mode: '0644'
        backup: false
      loop:
        # arcane-agent on valkyrie use this to communicate with arcane-server which is behind the Caddy on tantrum
        - { src: public/tantrum-caddy.crt, dest: tantrum-caddy.pem }
      when: inventory_hostname == 'valkyrie'

    - name: Trust Keycloak's HTTPS issuer on Proxmox VE
      when: inventory_hostname in groups['proxmox_hosts']
      block:
        # Proxmox uses the host trust store when it contacts auth.lab.
        - name: Install the public rpivn Caddy CA
          ansible.builtin.copy:
            src: "{{ rpivn_caddy_ca_src }}"
            dest: /usr/local/share/ca-certificates/rpivn-caddy.crt
            owner: root
            group: root
            mode: '0644'

        - name: Refresh the system CA bundle
          ansible.builtin.command: update-ca-certificates
          register: proxmox_pki_refresh
          changed_when: "'0 added, 0 removed' not in proxmox_pki_refresh.stdout"

    # Both destinations use the same public CA from the repository.
    - name: Distribute Caddy trust for control-plane OIDC
      become: "{{ ansible_user != 'root' }}"
      when: inventory_hostname in groups['control_planes']
      block:
        - name: Copy the standalone Caddy CA
          ansible.builtin.copy:
            src: "{{ rpivn_caddy_ca_src }}"
            dest: /etc/rancher/k3s/certs/rpivn-caddy.crt
            owner: root
            group: root
            mode: '0644'
            backup: true

        # Kubernetes expects inline PEM in certificateAuthority. The template
        # reads the same source as the copy task, so a CA rotation updates both.
        # K3s reads this host file via --authentication-config and can reload it
        # when its contents change.
        - name: Render K3s authentication config with the Caddy CA
          ansible.builtin.template:
            src: authentication.yaml.j2
            dest: /etc/rancher/k3s/authentication.yaml
            owner: root
            group: root
            mode: '0600'
            backup: true
