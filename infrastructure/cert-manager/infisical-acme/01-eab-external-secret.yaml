apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-acme-eab
  namespace: cert-manager
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: infisical-acme-eab
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: hmacKey
      remoteRef:
        key: /tls/INFISICAL_ACME_EAB_HMAC_KEY
        decodingStrategy: None
