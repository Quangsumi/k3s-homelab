apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgres

resources:
  - 00-namespace.yaml
  - 02-postgres.yaml
  #- 03-postgres-exporter.yaml
  - 04-pgadmin.yaml
  - 05-pgadmin-external-secret.yaml
  - 10-network-policies.yaml

configMapGenerator:
  - name: pgadmin-config
    files:
      - config_local.py=pgadmin-config/config_local.py