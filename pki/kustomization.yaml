apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Publish certificate sources once. trust-manager handles namespace distribution.
resources:
  - 10-rpivn-caddy-trust-bundle.yaml
  - 20-tantrum-caddy-trust-bundle.yaml
  - 30-coder-trust-bundle.yaml

configMapGenerator:
  - name: homelab-application-roots
    namespace: cert-manager
    files:
      - ca-bundle.pem=bundles/application-trust.pem
  # Rpivn Caddy: keep the existing object name for current readers.
  - name: caddy-root-ca
    namespace: cert-manager
    files:
      - ca.crt=public/rpivn-caddy.crt
  - name: tantrum-caddy-root-source
    namespace: cert-manager
    files:
      - ca.crt=public/tantrum-caddy.crt

generatorOptions:
  # Distribution rules read these fixed source names.
  disableNameSuffixHash: true
