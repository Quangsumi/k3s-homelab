# normal Ingress works with cert-manager.io/cluster-issuer: infisical-acme
# cert-manager's ingress-shim watches standard Kubernetes Ingress resources. 
# It does not automatically do the same thing for Traefik's IngressRoute CRD.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-lab
  namespace: kube-system
spec:
  secretName: traefik-lab-tls

  issuerRef:
    name: infisical-acme
    kind: ClusterIssuer

  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always

  dnsNames:
    - traefik.lab

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`traefik.lab`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService

  tls:
    secretName: traefik-lab-tls