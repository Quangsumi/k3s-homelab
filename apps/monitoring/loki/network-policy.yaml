apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-to-loki
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  # - otel-agent # used fluent-bit instead
                  - otel-gateway
        - podSelector:
            matchLabels:
              app: grafana

        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 3100
