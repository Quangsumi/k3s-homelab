# Trust both lab website certificates and Caddy-fronted lab services.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: coder-trust-bundle
spec:
  sources:
    - useDefaultCAs: true
    - configMap:
        name: homelab-application-roots
        key: ca-bundle.pem
    - configMap:
        name: caddy-root-ca
        key: ca.crt
  target:
    configMap:
      key: ca-bundle.pem
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [coder, coder-workspaces]
