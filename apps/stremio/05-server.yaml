# The official streaming server includes the BitTorrent engine and FFmpeg.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stremio-data
  namespace: stremio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stremio
  namespace: stremio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stremio
  template:
    metadata:
      labels:
        app: stremio
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: stremio/server:v4.22.0@sha256:30829e739e6336811830f87c3d725eb5f14169f94f54725c907f42275a3bda27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11470
          env:
            - name: APP_PATH
              value: /root/.stremio-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /heartbeat
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            # limits:
            #   cpu: "2"
            #   memory: 2Gi
            #   ephemeral-storage: 4Gi
          volumeMounts:
            - name: data
              mountPath: /root/.stremio-server
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stremio-data
---
apiVersion: v1
kind: Service
metadata:
  name: stremio
  namespace: stremio
spec:
  type: ClusterIP
  selector:
    app: stremio
  ports:
    - name: http
      port: 11470
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stremio
  namespace: stremio
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
    traefik.ingress.kubernetes.io/router.middlewares: stremio-stremio-web-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - stremio.lab
      secretName: stremio-lab-tls
  rules:
    - host: stremio.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stremio
                port:
                  number: 11470

---
# Stremio 4.22.0's root redirect uses the backend socket's HTTP scheme,
# ignoring X-Forwarded-Proto. Intercept only / at the TLS-terminating ingress.
# API, torrent video and heartbeat paths continue to the server unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stremio-web-redirect
  namespace: stremio
spec:
  redirectRegex:
    regex: '^https?://stremio\.lab(:[0-9]+)?/([?].*)?$'
    replacement: 'https://web.stremio.com/?streamingServerUrl=https%3A%2F%2Fstremio.lab'
    permanent: false