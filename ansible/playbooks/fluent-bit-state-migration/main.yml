---
# Standalone, one-time job. Never imported by install/configure.
- name: Check every node login before stopping collectors
  hosts: control_planes:workers
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Check SSH and sudo work on this node
      ansible.builtin.command: /usr/bin/true
      changed_when: false
      check_mode: false

- name: Move Fluent Bit pod state once
  hosts: control_planes[0]  # choose 1 control plane to run kubectl
  gather_facts: false       # Skip Ansible’s automatic collection of machine information, such as OS, CPU and network details
  become: false       # no auto use sudo for those tasks
  any_errors_fatal: true
  vars:
    nodes: "{{ (groups['control_planes'] + groups['workers']) | unique | list }}"
  tasks:
    - name: Read the current collector and config
      ansible.builtin.command:
        argv: [kubectl, -n, monitoring, get, daemonset/fluent-bit, configmap/fluent-bit-config, -o, json]
      register: current
      changed_when: false     # Report this task as unchanged
      check_mode: false       # Run this task even when the playbook uses --check

    - name: Read Argo CD sync settings
      ansible.builtin.command:
        argv: [kubectl, -n, argocd, get, application, monitoring, -o, json]
      register: argo
      changed_when: false     # Report this task as unchanged
      check_mode: false       # Run this task even when the playbook uses --check

    - name: Remember the collector settings
      ansible.builtin.set_fact:
        ds: "{{ (current.stdout | from_json)['items'] | selectattr('kind', 'equalto', 'DaemonSet') | first }}"
        cm: "{{ (current.stdout | from_json)['items'] | selectattr('kind', 'equalto', 'ConfigMap') | first }}"
        app: "{{ argo.stdout | from_json }}"

    - name: Check sync is paused and the old source paths are still configured
      ansible.builtin.assert:
        that:
          - app.spec.syncPolicy.automated is not defined or not (app.spec.syncPolicy.automated.enabled | default(true) | bool)
          - app.status.operationState.phase | default('') != 'Running'
          - app.operation is not defined
          - "'/var/lib/fluent-bit/storage' in cm.data['fluent-bit.conf']"
          - "'/var/lib/fluent-bit/flb_kube.db' in cm.data['fluent-bit.conf']"
          - >-
            (ds.spec.template.spec.nodeSelector | default({})).get('homelab/fluent-bit-state-migration', '') == 'paused'
            or (ds.status.numberReady | default(0) | int == nodes | length)
        fail_msg: Pause monitoring automatic sync and finish any running sync. Collectors must be ready or already paused by this job.

    - name: Stop the pod collectors
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - monitoring
          - patch
          - daemonset/fluent-bit
          - --type=merge
          - -p
          - '{"spec":{"template":{"spec":{"nodeSelector":{"homelab/fluent-bit-state-migration":"paused"}}}}}'
      changed_when: true
      when: not ansible_check_mode    # --check: skip this task; without --check: run it

    - name: Wait for the collector pods to exit
      ansible.builtin.command:
        argv: [kubectl, -n, monitoring, get, pods, -l, app.kubernetes.io/name=fluent-bit, -o, json]
      register: stopped
      until: (stopped.stdout | from_json)['items'] | length == 0
      retries: 60
      delay: 3
      changed_when: false
      when: not ansible_check_mode

# Each node is the play host. Its username and Vault lookup use its own name.
- name: Copy state on each node using that node's login
  hosts: control_planes:workers
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Copy the database and queue, then compare the copies
      ansible.builtin.shell: |
        set -eu
        fail() { echo "$1" >&2; exit 1; }
        cd /var/lib/fluent-bit || fail 'Missing /var/lib/fluent-bit'
        running=$(k3s crictl ps --name fluent-bit -q) || fail 'Cannot check running Fluent Bit containers'
        [ -z "$running" ] || fail 'A Fluent Bit container is still running; refusing to copy'
        [ -f flb_kube.db ] || fail 'Missing original database: /var/lib/fluent-bit/flb_kube.db'
        [ -d storage ] || fail 'Missing original queue: /var/lib/fluent-bit/storage'
        copied=false
        if [ ! -d pods/queue ]; then
          mkdir -p pods/queue
          copied=true
        fi
        for file in flb_kube.db flb_kube.db-wal flb_kube.db-shm; do
          if [ -f "$file" ]; then
            if [ ! -e "pods/$file" ]; then
              cp -a -- "$file" "pods/$file"
              copied=true
            fi
            cmp -- "$file" "pods/$file" || fail "Existing pods/$file differs; refusing to overwrite"
          elif [ -e "pods/$file" ]; then
            fail "pods/$file exists but its original is missing; inspect before continuing"
          fi
        done
        # Keep existing copies. Fill missing queue files, then compare everything.
        if ! diff -qr -- storage pods/queue >/dev/null; then copied=true; fi
        cp -an -- storage/. pods/queue/
        diff -qr -- storage pods/queue || fail 'Queue copies differ; originals and existing copies were kept'
        if [ "$copied" = true ]; then echo COPIED; else echo VERIFIED; fi
      register: state_copy
      changed_when: "'COPIED' in state_copy.stdout"
      when: not ansible_check_mode

- name: Use the copied state and restart collectors
  hosts: control_planes[0]
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    nodes: "{{ (groups['control_planes'] + groups['workers']) | unique | list }}"
  tasks:
    - name: Require a verified copy on every node before restarting
      ansible.builtin.assert:
        that:
        # hostvars[item] selects vars of node machine
        # state_copy was registerd as a var in the above play
          - hostvars[item].state_copy is defined                    
          - not (hostvars[item].state_copy.failed | default(true))
          - hostvars[item].state_copy.rc | default(1) == 0
      loop: "{{ nodes }}"
      when: not ansible_check_mode

    # The existing parent mount already makes its new pods/ subfolder visible.
    - name: Point the collector at the copied files
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - monitoring
          - patch
          - configmap/fluent-bit-config
          - --type=merge
          - -p
          - >-
            {{ {'data': {'fluent-bit.conf': cm.data['fluent-bit.conf'] |
              replace('/var/lib/fluent-bit/storage', '/var/lib/fluent-bit/pods/queue') |
              replace('/var/lib/fluent-bit/flb_kube.db', '/var/lib/fluent-bit/pods/flb_kube.db')}} | to_json }}
      changed_when: true
      when: not ansible_check_mode

    - name: Start the collectors again
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - monitoring
          - patch
          - daemonset/fluent-bit
          - --type=json
          - -p
          - >-
            {{ [{'op': 'replace', 'path': '/spec/template/spec/nodeSelector',
                 'value': ds.spec.template.spec.nodeSelector | default({}) | dict2items |
                   rejectattr('key', 'equalto', 'homelab/fluent-bit-state-migration') | items2dict}] | to_json }}
      changed_when: true
      when: not ansible_check_mode

    - name: Wait for the collectors to become ready
      ansible.builtin.command:
        argv: [kubectl, -n, monitoring, rollout, status, daemonset/fluent-bit, --timeout=180s]
      changed_when: false
      when: not ansible_check_mode
