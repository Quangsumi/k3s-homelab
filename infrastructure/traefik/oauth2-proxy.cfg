http_address = "0.0.0.0:4180"

provider = "keycloak-oidc"
provider_display_name = "Keycloak"
oidc_issuer_url = "https://auth.lab/realms/homelab"

client_id = "traefik-dashboard"
client_secret_file = "/etc/oauth2-proxy/secrets/client-secret"
# Keycloak returns the browser to the route that goes straight to this proxy.
redirect_url = "https://traefik.lab/oauth2/callback"
code_challenge_method = "S256"
scope = "openid profile email"

# Access requires this client role in the Keycloak access token.
email_domains = ["*"]
allowed_roles = ["traefik-dashboard:cr-traefik-dashboard-oauth2-proxy-access"]

# Return an allow response to ForwardAuth. Traefik serves api@internal.
upstreams = ["static://202"]
reverse_proxy = true
trusted_proxy_ips = ["10.42.0.0/16"]
whitelist_domains = ["traefik.lab"]
skip_provider_button = true

cookie_name = "__Host-traefik_dashboard_oauth2"
cookie_secret_file = "/etc/oauth2-proxy/secrets/cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
# The proxy tries to refresh your login when a request comes in with a
# cookie older than 4m. Keycloak's Access Token Lifespan is 5m.
cookie_refresh = "4m"
# Sliding 8h expiry. Each successful refresh gives the browser a fresh 8h.
cookie_expire = "8h"
# Keycloak issues refresh tokens (Use refresh tokens = On) and allows reuse
# (Revoke Refresh Token = Disabled).
# Client Session Idle and Client Session Max (both 0) inherit
# SSO Session Idle (sliding 12h, reset on refresh) and
# SSO Session Max (hard 7d cap from the original Keycloak sign-in).
# The sign-in state cookie lasts 15m by default (cookie_csrf_expire).

provider_ca_files = ["/etc/homelab/trust/ca-bundle.pem"]

pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false

silence_ping_logging = true
