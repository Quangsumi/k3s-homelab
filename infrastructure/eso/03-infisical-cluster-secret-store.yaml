apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://infisical.lab

      caProvider:
        type: ConfigMap
        name: infisical-ca
        namespace: external-secrets
        key: ca.crt

      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret

      secretsScope:
        projectSlug: k3s-j0tn
        environmentSlug: dev
        secretsPath: /