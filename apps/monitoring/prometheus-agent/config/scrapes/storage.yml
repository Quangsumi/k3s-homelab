# Storage metrics. Pod addresses are discovered automatically.
scrape_configs:
- job_name: longhorn-csi
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - longhorn-system
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_label_app
    action: keep
    regex: csi-(attacher|provisioner|resizer|snapshotter)
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: csi-(attacher|provisioner|resizer|snapshotter)
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_label_app
    target_label: component
  - target_label: cluster
    replacement: k3s-homelab
- job_name: longhorn-manager
  scrape_interval: 30s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - longhorn-system
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_label_app
    action: keep
    regex: longhorn-manager
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: manager
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_label_app
    target_label: component
  - target_label: cluster
    replacement: k3s-homelab
