---
- name: Read minimal platform facts
  ansible.builtin.setup:
    gather_subset: ['!all', min]

- name: Validate the supported platform and private listen address
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.service_mgr == 'systemd'
      - node_exporter_listen_address is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
      - node_exporter_listen_address != '0.0.0.0'
      - node_exporter_listen_address.split('.') | map('int') | min >= 0
      - node_exporter_listen_address.split('.') | map('int') | max <= 255
      - node_exporter_port | int > 0
      - node_exporter_port | int < 65536
    fail_msg: This role needs Linux/systemd, a concrete node_exporter_listen_address (IPv4) and a valid port.

- name: Freeze this machine's scrape target before any delegated probe
  ansible.builtin.set_fact:
    node_exporter_scrape_target: "{{ node_exporter_listen_address }}:{{ node_exporter_port }}"

- name: Read existing service identities
  ansible.builtin.service_facts:

- name: Check whether this job already owns the listener override
  ansible.builtin.stat:
    path: "{{ node_exporter_dropin }}"
  register: node_exporter_managed_dropin

- name: Inspect an existing exporter without printing its metrics
  ansible.builtin.uri:
    url: "http://{{ node_exporter_listen_address }}:{{ node_exporter_port }}/metrics"
    return_content: true
    use_proxy: false
    timeout: 5
  register: node_exporter_before
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Classify the existing exporter and service manager
  ansible.builtin.set_fact:
    node_exporter_existing_healthy: >-
      {{ node_exporter_before.status | default(0) | int == 200
         and (node_exporter_before.content | default('') is search('(?m)^node_exporter_build_info[{ ]'))
         and (node_exporter_before.content | default('') is search('(?m)^node_uname_info[{ ]')) }}
    node_exporter_existing_services: >-
      {{ ansible_facts.services.values()
         | selectattr('source', 'equalto', 'systemd')
         | rejectattr('status', 'equalto', 'not-found')
         | map(attribute='name')
         | intersect(node_exporter_known_services) | sort }}

- name: Require a single recognized systemd exporter service
  ansible.builtin.assert:
    that:
      - node_exporter_existing_services | length <= 1
    fail_msg: Multiple exporter services exist. Resolve the existing deployment; this job will not choose between them.

- name: Refuse to reuse a container or an unmanaged metrics endpoint
  ansible.builtin.assert:
    that:
      - >-
        not node_exporter_existing_healthy or
        (node_exporter_existing_services | length == 1 and
         ansible_facts.services[node_exporter_existing_services[0]].state == 'running')
    fail_msg: >-
      A healthy exporter is listening without a recognized running systemd exporter service.
      Retire the K3s Node Exporter DaemonSet or other container first, then rerun.
      This role does not remove Kubernetes resources or reuse container exporters.

- name: Decide whether this job manages the distro exporter
  ansible.builtin.set_fact:
    node_exporter_manage_package: >-
      {{ node_exporter_managed_dropin.stat.exists or node_exporter_existing_services | length == 0 }}

- name: Reuse an existing healthy systemd exporter
  ansible.builtin.debug:
    msg: >-
      Existing node-exporter is healthy at {{ node_exporter_listen_address }}:{{ node_exporter_port }}.
      No duplicate installation or listener reconfiguration.
  when: node_exporter_existing_healthy and not node_exporter_manage_package

- name: Require a free metrics port before starting an existing stopped service
  ansible.builtin.wait_for:
    host: "{{ node_exporter_listen_address }}"
    port: "{{ node_exporter_port }}"
    state: stopped
    timeout: 1
    connect_timeout: 1
    msg: Metrics port is occupied. Retire the old DaemonSet/container or resolve the listener before starting the systemd exporter.
  changed_when: false
  check_mode: false
  when:
    - not node_exporter_manage_package
    - not node_exporter_existing_healthy
    - node_exporter_existing_services | length == 1
    - ansible_facts.services[node_exporter_existing_services[0]].state != 'running'

- name: Start a recognized existing service rather than installing a second exporter
  ansible.builtin.systemd_service:
    name: "{{ node_exporter_existing_services | first }}"
    enabled: true
    state: started
  when:
    - not node_exporter_manage_package
    - not node_exporter_existing_healthy
    - node_exporter_existing_services | length == 1

- name: Install or configure only the exporter owned by this job
  ansible.builtin.include_tasks: install.yml
  when: node_exporter_manage_package

- name: Apply a changed managed listener before verification
  ansible.builtin.meta: flush_handlers

- name: Ensure the managed service stays enabled and running
  ansible.builtin.systemd_service:
    name: "{{ node_exporter_service }}"
    enabled: true
    state: started
  when:
    - node_exporter_manage_package
    - not ansible_check_mode or node_exporter_service in ansible_facts.services

- name: Verify metrics and network reachability after an actual run
  ansible.builtin.include_tasks: verify.yml
  when: not ansible_check_mode

- name: Explain check-mode limits
  ansible.builtin.debug:
    msg: Preview only. Package/listener/start changes have not been applied; post-install metrics and monitoring-VM reachability are not proved.
  when: ansible_check_mode
