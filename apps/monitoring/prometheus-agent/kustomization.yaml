apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
- statefulset.yaml
- service.yaml
- rbac.yaml
- network-policy.yaml
- remote-write-external-secret.yaml
- litellm-external-secret.yaml
configMapGenerator:
- name: prometheus-agent-config
  files:
  - config/prometheus.yml
- name: prometheus-agent-scrapes
  # Each key contains the entire named file; the projected volume puts it in scrapes/.
  files:
  - config/scrapes/applications.yml
  - config/scrapes/kubernetes.yml
  - config/scrapes/control-plane.yml
  - config/scrapes/observability.yml
  - config/scrapes/network.yml
  - config/scrapes/argocd.yml
  - config/scrapes/certificates.yml
  - config/scrapes/external-secrets.yml
  - config/scrapes/storage.yml
