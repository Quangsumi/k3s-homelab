apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - 00-namespace.yaml
  - 06-prometheus.yaml
  - 07-grafana.yaml
  - 10-network-policies.yaml

configMapGenerator:
  - name: grafana-config
    files:
      - ./grafana-config/grafana.ini

  - name: grafana-datasources
    files:
      - prometheus.yaml=./grafana-config/prometheus-datasource.yaml