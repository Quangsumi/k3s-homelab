apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-ca-key-pair
  namespace: cert-manager
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h

  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore

  target:
    name: homelab-ca-key-pair
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/tls

  data:
    - secretKey: tls.crt
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: /tls/HOMELAB_ROOT_CA_CRT

    - secretKey: tls.key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: /tls/HOMELAB_ROOT_CA_KEY