apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab-gitops
    homelab.quangsumi.io/tier: platform
spec:
  project: homelab-platform

  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.11.2
      helm:
        releaseName: longhorn
        values: |
          persistence:
            defaultClass: true            # local-path is default, mark this will make longhorn default StorageClass
            defaultClassReplicaCount: 3
            reclaimPolicy: Retain         # Delete PVC ->  PV remains Released -> data still exists -> manually recover or delete later

          defaultSettings:
            storageOverProvisioningPercentage: 100
            defaultDataPath: /var/lib/longhorn

          preUpgradeChecker:
            jobEnabled: false

    - repoURL: https://github.com/Quangsumi/k3s-homelab.git
      targetRevision: main
      path: infrastructure/longhorn   

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    syncOptions:
      - CreateNamespace=true