apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: normal-ass-note
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Quangsumi/k3s-homelab.git
    targetRevision: main
    path: apps/normal-ass-note

  destination:
    server: https://kubernetes.default.svc
    namespace: normal-ass-note

  syncPolicy:
    syncOptions:
      - CreateNamespace=true